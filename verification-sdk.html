/* ---------- schema validation ---------- */
const RX = { base:/^[A-Za-z0-9]{5,45}$/, vpa:/^[A-Za-z0-9._-]{2,256}@[A-Za-z0-9]{2,64}$/, name:/^[^@#$%^&*]{2,}$/, acct:/^[0-9]{9,18}$/, ifsc:/^[A-Z]{4}0[A-Z0-9]{6}$/, hex:/^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$/, vbaPurpose:/^[A-Za-z0-9 ]{5,255}$/ };
const TOP_KEYS = ['journey_type','base_reference_id','data_entry_mode','prefill','rpd','vp','vba','x_on_behalf_of','theme_override','auto_close_seconds'];
const THEME_KEYS = [...PALETTE_KEYS,'logo','header_title','dark_palette','font_family','title_size','body_size','caption_size','button_style','button_corner_radius','button_height','button_text_case','input_style','input_corner_radius','input_fill','input_border_focused','card_corner_radius','strings','auto_close_seconds'];
const PF_RULE = { upi_vpa:[RX.vpa,'must look like name@handle'], customer_name:[RX.name,'2+ characters, none of @#$%^&*'], name:[RX.name,'2+ characters, none of @#$%^&*'], account_number:[RX.acct,'must be 9–18 digits'], ifsc:[RX.ifsc,'must match ^[A-Z]{4}0[A-Z0-9]{6}$ (uppercase)'] };
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
function validateRequest(q){
  const E = [], W = [], err = (p, m) => E.push({ path:p, msg:m }), warn = m => W.push(m);
  if (!isObj(q)){ err('$', 'must be a JSON object'); return { errors:E, warnings:W }; }
  Object.keys(q).forEach(k => { if (!TOP_KEYS.includes(k)) err(k, 'is not allowed (additionalProperties: false)'); });
  const jt = q.journey_type, JJ = JOURNEYS[jt], steps = JJ ? JJ.steps : [];
  if (jt === undefined) err('journey_type', 'is required'); else if (!JJ) err('journey_type', 'must be one of ' + Object.keys(JOURNEYS).join(', '));
  if (q.base_reference_id === undefined) err('base_reference_id', 'is required');
  else if (typeof q.base_reference_id !== 'string' || !RX.base.test(q.base_reference_id)) err('base_reference_id', 'must be alphanumeric, 5–45 characters (no hyphens)');
  if (q.data_entry_mode !== undefined && !['COLLECT','SKIP'].includes(q.data_entry_mode)) err('data_entry_mode', 'must be COLLECT or SKIP');
  const blk = (name, allowed, check) => {
    const b = q[name]; if (b === undefined) return;
    if (!isObj(b)){ err(name, 'must be an object'); return; }
    Object.keys(b).forEach(k => { if (!allowed.includes(k)) err(name + '.' + k, 'is not allowed'); });
    check(b);
    if (JJ && !steps.includes(name.toUpperCase())) warn(`${name} is ignored: ${jt} has no ${name.toUpperCase()} step`);
  };
  blk('rpd', ['expiry_minutes'], b => { if (b.expiry_minutes !== undefined && !(Number.isInteger(b.expiry_minutes) && b.expiry_minutes >= 1 && b.expiry_minutes <= 60)) err('rpd.expiry_minutes', 'must be an integer from 1 to 60'); });
  blk('vp', ['purpose_message','perform_name_match','fetch_branch_details'], b => {
    if (b.purpose_message !== undefined && (typeof b.purpose_message !== 'string' || b.purpose_message.length < 4)) err('vp.purpose_message', 'must be at least 4 characters');
    ['perform_name_match','fetch_branch_details'].forEach(k => { if (b[k] !== undefined && typeof b[k] !== 'boolean') err('vp.' + k, 'must be true or false'); });
  });
  blk('vba', ['validation_type','perform_name_match','purpose_message'], b => {
    if (b.validation_type !== undefined && !['penniless','pennydrop','hybrid'].includes(b.validation_type)) err('vba.validation_type', 'must be penniless, pennydrop or hybrid');
    if (b.perform_name_match !== undefined && typeof b.perform_name_match !== 'boolean') err('vba.perform_name_match', 'must be true or false');
    if (b.purpose_message !== undefined && (typeof b.purpose_message !== 'string' || !RX.vbaPurpose.test(b.purpose_message))) err('vba.purpose_message', 'must be 5–255 letters, digits or spaces');
  });
  if (q.x_on_behalf_of !== undefined){
    if (typeof q.x_on_behalf_of !== 'string' || !q.x_on_behalf_of.length) err('x_on_behalf_of', 'must be a non-empty string');
    else if (JJ && !steps.includes('RPD') && !steps.includes('VP')) warn('x_on_behalf_of is never sent on VBA, so it is unused in ' + jt);
  }
  if (q.auto_close_seconds !== undefined && !(Number.isInteger(q.auto_close_seconds) && q.auto_close_seconds >= 0)) err('auto_close_seconds', 'must be an integer ≥ 0');
  const accepts = !JJ ? [] : JJ.entry === 'vp' ? ['upi_vpa','customer_name'] : JJ.entry === 'vba' ? ['name','account_number','ifsc'] : [];
  const pf = q.prefill;
  if (pf !== undefined){
    if (!isObj(pf)) err('prefill', 'must be an object');
    else Object.keys(pf).forEach(k => {
      if (!PF_RULE[k]){ err('prefill.' + k, 'is not allowed'); return; }
      const f = pf[k];
      if (!isObj(f)){ err('prefill.' + k, 'must be { "value": …, "editable": … }'); return; }
      Object.keys(f).forEach(x => { if (!['value','editable'].includes(x)) err(`prefill.${k}.${x}`, 'is not allowed'); });
      if (typeof f.value !== 'string') err(`prefill.${k}.value`, 'is required and must be a string');
      else if (!PF_RULE[k][0].test(f.value)) err(`prefill.${k}.value`, PF_RULE[k][1]);
      if (f.editable !== undefined && typeof f.editable !== 'boolean') err(`prefill.${k}.editable`, 'must be true or false');
      if (JJ && !accepts.includes(k)) warn(`prefill.${k} is ignored: ${jt} does not accept it`);
    });
  }
  if (q.data_entry_mode === 'SKIP' && JJ){
    if (!JJ.entry) warn('data_entry_mode is ignored: ' + jt + ' has no entry screen');
    const need = JJ.entry === 'vp' ? ['upi_vpa', ...(q.vp?.perform_name_match ? ['customer_name'] : [])] : JJ.entry === 'vba' ? ['account_number','ifsc', ...(q.vba?.perform_name_match ? ['name'] : [])] : [];
    need.forEach(k => { if (!isObj(pf) || !isObj(pf[k]) || !pf[k].value) err('prefill.' + k, 'is required when data_entry_mode is SKIP'); });
  }
  const t = q.theme_override;
  if (t !== undefined){
    if (!isObj(t)) err('theme_override', 'must be an object');
    else Object.keys(t).forEach(k => {
      const v = t[k], P = 'theme_override.' + k;
      if (!THEME_KEYS.includes(k)) return err(P, 'is not a theme property');
      if ([...PALETTE_KEYS,'input_fill','input_border_focused'].includes(k) && !(typeof v === 'string' && RX.hex.test(v))) err(P, 'must be a hex colour like #0B5FFF');
      if (k === 'header_title' && (typeof v !== 'string' || v.length > 30)) err(P, 'must be text, max 30 characters');
      if ((k === 'button_style' || k === 'input_style') && !['FILLED','OUTLINED'].includes(v)) err(P, 'must be FILLED or OUTLINED');
      if (k === 'button_text_case' && !['UPPERCASE','SENTENCE'].includes(v)) err(P, 'must be UPPERCASE or SENTENCE');

function fakeStep(p, s){
  const base = { product:p, status:s, reference_id:st.base + p + '1', decentro_txn_id:hex32(), api_status:'SUCCESS', response_key:'', error_retries:0, is_masked:false, data:{} };

}
function preview(id){
  freshRun(); closeOverlays(); $('#handoff').classList.remove('on'); $('#scr').classList.remove('ho');
  st.sdkOpen = true; $('#sdk').classList.add('open'); paintBars(); st.startedAt = new Date();
  const seq = J().steps, ok = { RPD:'SUCCESS', VP:'VERIFIED', VBA:'VALID' };
  const upTo = (p, s) => { for (const q of seq){ if (q === p){ st.steps[q] = fakeStep(q, s); break; } st.steps[q] = fakeStep(q, ok[q]); } };
  const fillAll = () => seq.forEach(q => st.steps[q] = fakeStep(q, ok[q]));
  const result = (status, failed, reason) => { st.final = { status, failed, reason }; go('result'); };
  st.rpdTxn = hex32(); st.expiryEnd = Date.now() + cfg.expiry * 60000; st.app = 'PhonePe';
  const fill = () => { st.form = { vpa:CUST.vpa, name:CUST.typed, acct:CUST.acct, acct2:CUST.acct, ifsc:CUST.ifsc }; };
  const saveCfg = () => { const m = cfg.mode, pf = st.pf; st.pvRestore = () => { cfg.mode = m; st.pf = pf; }; };
  st.pv = id;
  if (id === 'consent') go('consent');
  else if (id === 'apps' || id === 'sheet' || id === 'awaiting' || id === 'awaiting-net' || id === 'dialog'){
    st.steps.RPD = fakeStep('RPD', 'PENDING');
    if (id.startsWith('awaiting') || id === 'dialog'){ st.showTry = true; st.netLost = id === 'awaiting-net'; go('awaiting'); if (id === 'dialog') openDialog(); }
    else { go('apps'); if (id === 'sheet') openSheet(); }
  }
  else if (id === 'entry') go('entry');
  else if (id === 'entry-err'){ st.form = { vpa:'aditi', name:'A#', acct:'50100', acct2:'5010', ifsc:'hdfc012' }; st.touched = { vpa:1, name:1, acct:1, acct2:1, ifsc:1 }; st.showAll = true; saveCfg(); cfg.mode = 'COLLECT'; st.pf = {}; go('entry'); }
  else if (id === 'entry-skip'){ saveCfg(); cfg.mode = 'SKIP'; fill(); st.pf = { upi_vpa:{value:CUST.vpa,editable:false}, customer_name:{value:CUST.typed,editable:false}, name:{value:CUST.typed,editable:false}, account_number:{value:CUST.acct,editable:false}, ifsc:{value:CUST.ifsc,editable:false} }; go('entry'); }
  else if (id === 'entry-lock'){ saveCfg(); cfg.mode = 'COLLECT'; fill(); st.pf = { upi_vpa:{value:CUST.vpa,editable:false}, customer_name:{value:CUST.typed,editable:false}, name:{value:CUST.typed,editable:true}, account_number:{value:CUST.acct,editable:false}, ifsc:{value:CUST.ifsc,editable:false} }; go('entry'); }
  else if (id === 'entry-a2'){ saveCfg(); cfg.mode = 'COLLECT'; st.pf = {}; fill(); st.attempt = 2; if (st.j === 'VP_VBA'){ st.tried = [CUST.vpa]; st.touched = { vpa:1 }; } go('entry'); }
  else if (id === 'verifying' || id === 'verifying-pend'){
    const i = id === 'verifying-pend' ? seq.indexOf('VP') : Math.min(1, seq.length - 1);
    st.prog = {}; seq.forEach((q, k) => { if (k < i){ st.prog[q] = 'done'; st.steps[q] = fakeStep(q, ok[q]); } else if (k === i) st.prog[q] = id === 'verifying-pend' ? 'pend' : 'active'; else st.prog[q] = 'wait'; });
    if (J().entry) st.form.vpa = st.form.vpa || CUST.vpa;
    go('verifying');
  }
  else if (id === 'processing'){ go('processing'); }
  else if (id === 'r-verified'){ fillAll(); result('VERIFIED'); }
  else if (id === 'r-declined'){ upTo('RPD', 'FAILED'); result('NOT_VERIFIED', 'RPD', { b:'Payment declined', s:'Your bank declined the ₹1 payment.' }); }
  else if (id === 'r-expired'){ upTo('RPD', 'EXPIRED'); result('NOT_VERIFIED', 'RPD', { b:'Payment link expired', s:'No money was taken.' }); }
  else if (id === 'r-vpfail'){ upTo('VP', 'NOT_VERIFIED'); result('NOT_VERIFIED', 'VP', { b:VPR[0].b, s:VPR[0].s }); }
  else if (id === 'r-pending'){ upTo('VP', 'PENDING'); result('PENDING', 'VP'); }
  else if (id === 'r-invalid'){ upTo('VBA', 'INVALID'); result('NOT_VERIFIED', 'VBA', { b:'The account number/IFSC passed is invalid.', s:'' }); }
  else if (id === 'r-inconc'){ upTo('VBA', 'INCONCLUSIVE'); result('INCONCLUSIVE', 'VBA', { b:'Bank account details', s:'could not be verified.' }); }
  else if (id === 'r-nre'){ upTo('VBA', 'NRE'); result('NRE'); }
  else if (id === 'r-modify'){
    saveCfg(); cfg.mode = 'COLLECT'; st.pf = {}; fill();
    const p = J().entry === 'vp' ? 'VP' : 'VBA';
    upTo(p, p === 'VP' ? 'NOT_VERIFIED' : 'INVALID');
    result('NOT_VERIFIED', p, p === 'VP' ? { b:VPR[0].b, s:VPR[0].s } : { b:'The account number/IFSC passed is invalid.', s:'' });
  }

    const k = id.slice(2), E = errDef(k, errStep(k));
    if (E.step && seq.includes(E.step) && E.step !== seq[0]) upTo(E.step, 'ERROR');
    st.err = E; go('error');
  }
  log('SDK', `Preview · <b>${esc((pvList().find(x => x.id === id) || {}).l || id)}</b> · sample data, no callbacks`);
  renderScreens(); renderState();
}

function backendSnippets(){
  return `// Merchant backend · token endpoint the SDK's tokenProvider calls.
// Credentials stay on the server; the app only ever sees a short-lived token.
// Illustrative: confirm the auth endpoint and expiry with Decentro (OP-3, OP-4).
app.post('/decentro/sdk-token', requireUser, async (req, res) => {
  const set = req.body.credential_set;               // "DECFIN" | "DECENTRO"
  const creds = set === 'DECFIN' ? DECFIN_CREDS : DECENTRO_CREDS;
  const { token, expires_at } = await decentroAuth.issueToken(creds);
  res.json({ token, expires_at });                    // SDK caches until expiry
});

// Merchant backend · confirm the outcome before acting on it (§5.5.9).
// The result object is built on the phone, so re-check each step server-side.
async function confirmJourney(result) {
  for (const step of result.steps.filter(s => s.status !== 'NOT_RUN')) {
    if (step.product === 'VBA') continue;             // VBA has no status API (OP-12)
    const status = await decentro.getStatus(step.product, step.decentro_txn_id);
    if (status !== step.status) throw new Error('Mismatch on ' + step.reference_id);
  }
}`;
}
