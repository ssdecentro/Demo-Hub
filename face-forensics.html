const STEPS_OF = j => j === 'LIVE_MATCH' ? ['LIVE','MATCH'] : j === 'LIVE' ? ['LIVE'] : ['MATCH'];
const FLOW = j => {
  const needsDoc = STEPS_OF(j).includes('MATCH');
  return [['consent','Consent'], ['guide','Guide'], ['cap','Selfie'], ['rev','Review'],
    ...(needsDoc ? [['doc','ID photo']] : []), ['chk','Checks'], ['res','Result']];
};
function freshRun(){
  clearTimers();
  st.net = []; st.cbs = []; st.logs = []; st.netN = 0; st.netOpen = null; st.t0 = Date.now();
  st.steps = {}; st.refs = []; st.attempt = 1; st.consentAt = null; st.result = null;
  st.camPhase = 0; st.selfie = null; st.target = null; st.preview = null; st.retried = false;
  st.mock = { ...(OUT[st.out]?.m || {}), ...(st.mockOverride || {}) };
}
function restart(){
  freshRun();
  st.screen = 'app'; $('#sdk').classList.remove('open'); $('#camS').hidden = true;
  closeOverlays();
  log('SDK', `<b>Restart</b> · ${esc(JLABEL[st.j])} · outcome <b>${esc(OUT[st.out].n)}</b>`);
  render(); renderAll();
}
function go(id){
  st.screen = id;
  clearTimers();
  closeOverlays();
  $('#camS').hidden = id !== 'cap' && id !== 'doccap';
  $('#sdk').classList.toggle('open', id !== 'app');
  log('SCREEN', `<b>${esc(SCREENS[id]?.t || id)}</b>`);
  emitStep(id);
  render(); renderSpec(); renderState(); renderScreens(); fit();
  if (id === 'cap' || id === 'doccap') runCamera();
  if (id === 'chk') runChecks();
}
function emitStep(id){
  const f = FLOW(st.j), i = f.findIndex(x => x[0] === id);
  if (i >= 0) emit('onStep', { screen:id, step:i + 1, of:f.length, journey:st.j });
}
function closeOverlays(){ ['#scrim','#sheet','#dlg'].forEach(s => $(s).classList.remove('on')); }
let toastT = null;
function toast(t){
  const el = $('#toast'); el.textContent = t; el.classList.add('on');
  /* own timer, not st.timers — clearTimers() on the next render used to kill the dismissal
     and leave the toast pinned to the screen for good. Raw setTimeout so playback speed
     does not stretch it either. */
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), 2600);
}

/* ---------- camera ---------- */
const CAM_HINTS = [
  ['Centre your face in the oval', ''],
  ['Move a little closer', 'bad'],
  ['Hold still', 'good']
];
function runCamera(){
  if (M().cam === 'denied'){ later(() => go('denied'), 420); return; }
  st.camPhase = 0; render();
  const tick = () => {
    st.camPhase++;
    if (st.camPhase <= 2){ render(); later(tick, 1150); return; }
    if (cfg.autoCapture){ countdown(3); } else { render(); }
  };
  later(tick, 1000);
}
function countdown(n){
  st.camCount = n; render();
  if (n === 0){ st.camCount = null; return capture(); }
  later(() => countdown(n - 1), 700);
}
function capture(){
  const fl = $('#camFlash'); if (fl){ fl.classList.add('go'); }
  const m = M();
  const kind = m.face === 'none_source' ? 'none' : m.face === 'multi' ? 'multi' : (m.attack || 'live');
  if (st.screen === 'doccap'){ st.target = 'doc'; log('SDK', '<b>ID photo captured</b> · 1 frame, JPEG 72 KB'); later(() => go('chk'), 420); return; }
  st.selfie = kind;
  log('SDK', `<b>Selfie captured</b> · 1 frame, JPEG 118 KB${m.attack ? ` · presentation-attack sample (${esc(m.attack)})` : ''}`);
  later(() => go('rev'), 460);
}

/* ---------- checks ---------- */
function runChecks(){
  st.chk = { up:'active', LIVE:'wait', MATCH:'wait' };
  render();
  later(() => {
    st.chk.up = 'done'; render();
    const steps = STEPS_OF(st.j);
    const runStep = i => {
      if (i >= steps.length) return finish();
      const s = steps[i];
      st.chk[s] = 'active'; render();
      const onDone = r => {
        if (M().api === 'timeout' && !st.retried){
          st.retried = true;
          net({ kind:'WARN', step:s, method:'POST', path:PATH[s], headers:s === 'LIVE' ? liveHeaders() : matchHeaders(),
            body:null, http:0, res:{ error:'ETIMEDOUT', detail:'No response in 15000 ms' }, ms:15000,
            label:(s === 'LIVE' ? 'Passive Liveness' : 'Face Match') + ' (timed out)', txt:'timeout · retrying once', code:'ETIMEDOUT' });
          st.chk[s] = 'pend'; render();
          later(() => { st.mock = { ...st.mock, api:null }; runStep(i); }, 900);
          return;
        }
        if (!r.ok){ st.chk[s] = r.err ? 'fail' : 'fail'; render(); return later(() => finish(), 520); }
        st.chk[s] = s === 'LIVE' && r.live === 'no' ? 'fail' : (s === 'MATCH' && !r.pass ? 'fail' : 'done');
        render();
        if (s === 'LIVE' && r.live === 'no'){ return later(() => finish(), 520); }
        if (s === 'MATCH' && !r.pass){ return later(() => finish(), 520); }
        later(() => runStep(i + 1), 360);
      };
      if (s === 'LIVE') callLiveness(onDone); else callFaceMatch(onDone);
    };
    later(() => runStep(0), 420);
  }, 700);
}
function finish(){
  const steps = STEPS_OF(st.j);
  const L = st.steps.LIVE, Mt = st.steps.MATCH;
  const errKey = (L && L.err) || (Mt && Mt.err) || null;
  let status = 'VERIFIED';
  if (errKey) status = 'ERROR';
  else if ((L && (L.status === 'NOT_LIVE' || L.status === 'FAILED')) || (Mt && (Mt.status === 'NOT_MATCHED' || Mt.status === 'FAILED'))) status = 'FAILED';
  else if ((L && L.status === 'REVIEW') || (Mt && Mt.match !== undefined && Mt.match < cfg.threshold + 5)) status = 'REVIEW';
  st.result = {
    journey_id:'FF-' + hex32(3).slice(0, 10), journey_type:st.j, reference_base:P.base,
    application_id:P.applicationId, status,
    consent:{ given:true, at:st.consentAt, purpose:cfg.purpose },
    steps:steps.map(s => {
      const d = st.steps[s] || {};
      return s === 'LIVE'
        ? { product:'PASSIVE_LIVENESS', endpoint:PATH.LIVE, reference_id:d.ref || null, decentro_txn_id:d.txn || null,
            status:d.status || 'NOT_RUN', live:d.live ?? null, liveness_score:d.score != null ? String(d.score) : null,
            need_to_review:d.review ?? null, error:d.err ? ERRS[d.err].key : (d.reason || null) }
        : { product:'FACE_MATCH', endpoint:PATH.MATCH, reference_id:d.ref || null, decentro_txn_id:d.txn || null,
            status:d.status || 'NOT_RUN', match:d.match != null ? d.match.toFixed(1) + '%' : null, threshold:cfg.threshold,
            source_image:0, target_image:1, error:d.err ? ERRS[d.err].key : (d.reason || null) };
    }),
    error:errKey ? { code:ERRS[errKey].sdk, response_key:ERRS[errKey].key, message:ERRS[errKey].msg } : null,
    completed_at:stamp(nowIST())
  };
  if (status === 'REVIEW' && cfg.reviewRoute) routeForReview();
  if (errKey) emit('onError', { code:ERRS[errKey].sdk, message:ERRS[errKey].msg, response_key:ERRS[errKey].key });
  else emit('onResult', st.result);
  go(errKey ? 'err' : 'res');
}
function routeForReview(){
  const L = st.steps.LIVE || {}, Mt = st.steps.MATCH || {};
  log('WARN', '<b>Routed for manual review</b> · needToReview yes',
    `case ${P.applicationId} · ${L.ref || Mt.ref} · score ${L.score ?? '—'} · match ${Mt.match != null ? Mt.match.toFixed(1) + '%' : '—'}`);
  emit('onReviewRequired', { application_id:P.applicationId, reference_id:L.ref || Mt.ref,
    liveness_score:L.score != null ? String(L.score) : null, match:Mt.match != null ? Mt.match.toFixed(1) + '%' : null,
    reason:L.review ? 'NEED_TO_REVIEW' : 'MATCH_NEAR_THRESHOLD' });
}

/* ---------- SDK exit paths ---------- */
function declineConsent(){
  log('SDK', '<b>Consent declined</b> on the consent screen');
  emit('onCancelled', { reason:'CONSENT_DECLINED', screen:'consent' });
  st.screen = 'app'; $('#sdk').classList.remove('open'); render(); renderAll();
  toast('onCancelled(CONSENT_DECLINED) — the SDK closed without a call');
}
function dismiss(){
  emit('onDismiss', { screen:st.screen, status:st.result ? st.result.status : 'INCOMPLETE' });
  st.screen = 'app'; $('#sdk').classList.remove('open'); $('#camS').hidden = true; render(); renderAll();
}
function askCancel(){
  const d = $('#dlg');
  d.innerHTML = `<h4 id="dlgT">Leave the face check?</h4><p>Nothing has been verified yet. You can start again from ${esc(preset().merchant)} whenever you like.</p>
    <button class="s-btn pri" type="button" data-a="stay">Keep going</button>
    <button class="s-btn txt" type="button" data-a="leave">Leave</button>`;
  $('#scrim').classList.add('on'); d.classList.add('on');
}
function handleBack(){
  if ($('#dlg').classList.contains('on')){ closeOverlays(); return; }
  const order = FLOW(st.j).map(x => x[0]);
  const i = order.indexOf(st.screen);
  if (st.screen === 'app') return toast('Already on the merchant app screen');
  if (st.screen === 'res' || st.screen === 'err' || st.screen === 'denied') return dismiss();
  if (i <= 0) return askCancel();
  if (st.screen === 'chk') return toast('Back is blocked while a check is in flight');
  go(order[i - 1]);
}

function renderFlow(){

  $('#flowbar').innerHTML = f.map(([k, label], n) => {
    const cur = n === i || (i < 0 && k === 'res' && (id === 'err' || id === 'denied'));

        <span class="st" style="background:color-mix(in srgb,${stBg} 14%,transparent);color:${stBg}">${plain(tone === 'ok' ? IC.chk : tone === 'wn' ? IC.clock : IC.x).replace('<svg', '<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"')}${esc(r.status)}</span>
        <div class="kv">
          ${r.steps.map(s => `<span>${s.product === 'PASSIVE_LIVENESS' ? 'Liveness' : 'Face match'}</span><b>${esc(s.product === 'PASSIVE_LIVENESS' ? (DEV() ? (s.live ? 'live ' + s.live + (s.liveness_score ? ' · ' + s.liveness_score : '') : s.status) : (s.live === 'yes' ? 'Passed' : s.status === 'NOT_RUN' ? 'Not run' : 'Failed')) : (DEV() ? (s.match || s.status) : (s.status === 'MATCHED' ? 'Passed' : s.status === 'NOT_RUN' ? 'Not run' : 'Failed')))}</b>`).join('')}
          ${DEV() ? `<span>Journey</span><b>${esc(r.journey_id)}</b>` : ''}
        </div>
        ${DEV() ? '<p style="font-size:12px">The merchant acts on this object only after confirming each step server-side.</p>' : ''}
      </div>` : ''}
      <div class="h-foot">
        <button class="s-btn pri ${open ? 'dis' : ''}" type="button" data-a="start" ${open ? 'disabled' : ''} data-c="HostPrimaryButton">${open ? 'Face check in progress…' : r ? 'Run the face check again' : 'Start face check'}</button>
        ${DEV() ? `<div class="h-cb">${open ? 'startJourney() · SDK presented' : r ? (r.error ? 'onError → onDismiss' : 'onResult → onDismiss') : 'startJourney(request, callbacks)'}</div>` : ''}
      </div>
    </div>`;
}

/* ---------- result ---------- */
function meter(label, val, max, tone, threshold, foot){
  const pctw = clamp(val / max * 100, 2, 100);
  return `<div class="mtr" data-c="ScoreMeter"><div class="mtr-h"><b>${esc(label)}</b><span class="v">${esc(String(val))}${max === 100 && label.includes('Match') ? '%' : ''}</span></div>
    <div class="mtr-t"><i class="${tone}" style="width:${pctw}%"></i>${threshold != null ? `<u style="left:${threshold}%"></u>` : ''}</div>
    <div class="mtr-f"><span>${esc(foot || '')}</span>${threshold != null ? `<span class="th">threshold ${threshold}</span>` : ''}</div></div>`;
}
function resultBody(){
  const r = st.result, L = st.steps.LIVE, Mt = st.steps.MATCH, o = OUT[st.out], m = M();
  const ok = r.status === 'VERIFIED', rev = r.status === 'REVIEW';
  const tone = ok ? 'ok' : rev ? 'wn' : 'bad';
  const faceFail = (L && L.reason) || (Mt && Mt.reason);
  const title = ok ? 'You’re verified' : rev ? 'Thanks — we’re taking a closer look'
    : faceFail === 'multi' ? 'More than one face in the photo'
    : faceFail === 'no_face' || faceFail === 'no_face_src' ? 'We could not find your face'
    : faceFail === 'no_face_tgt' ? 'Your document photo could not be read'
    : (L && L.live === 'no' && m.retake) ? 'We could not be sure that was live'
    : (L && L.live === 'no' && m.retake) ? 'We could not be sure that was live'
    : (L && L.live === 'no') ? 'That did not look like a live photo'
    : 'The photos did not match';
  const sub = ok ? `${esc(preset().merchant)} has what it needs. You can close this and carry on.`
    : rev ? 'Nothing more for you to do. Someone will review this and the application continues — usually within a few minutes.'
    : faceFail === 'multi' ? 'Only you should be in the frame. Move somewhere quieter and take it again.'
    : faceFail === 'no_face' || faceFail === 'no_face_src' ? 'Hold the phone at eye level, fill the oval, and keep your face clear of anything covering it.'
    : faceFail === 'no_face_tgt' ? `The photo on your ${esc(DOC().label)} could not be read. Capture the card again instead.`
    : (L && L.live === 'no') ? (m.retake ? 'The lighting was too poor to be sure. Find a brighter spot and take one more.' : 'A photo of a photo, a screen or a mask does not pass. Take the selfie yourself, in person.')
    : 'The selfie and the photo on your record are not the same face. Check you are using your own documents.';
  const canRetake = !ok && !rev && (m.retake || faceFail === 'multi' || faceFail === 'no_face' || faceFail === 'no_face_src') && st.attempt < 3;
  const steps = STEPS_OF(st.j);
  const lines = steps.map(s => {
    const d = st.steps[s] || {};
    if (s === 'LIVE'){
      const g = d.live === 'yes' ? (d.review === 'yes' ? 'wn' : 'ok') : d.status ? 'bad' : 'nr';
      return `<span class="${g}">${plain(g === 'ok' ? IC.chk : g === 'wn' ? IC.clock : IC.x).replace('<svg', '<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"')}Liveness ${d.live === 'yes' ? (d.review === 'yes' ? 'under review' : 'passed') : d.status ? 'failed' : 'not run'}</span>`;
    }
    const g = d.status === 'MATCHED' ? 'ok' : d.status ? 'bad' : 'nr';
    return `<span class="${g}">${plain(g === 'ok' ? IC.chk : IC.x).replace('<svg', '<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"')}Face match ${d.status === 'MATCHED' ? 'passed' : d.status ? 'failed' : 'not run'}</span>`;
  }).join('');
  const showPair = steps.includes('MATCH') && Mt && Mt.match != null;
  return `
    <div class="s-center" style="padding-top:4px">
      <div class="r-ic ${tone} pop" data-c="ResultIcon">${plain(ok ? IC.chk : rev ? IC.clock : IC.warn).replace('<svg', '<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"')}</div>
      <h2 class="r-h" data-c="ScreenTitle">${esc(title)}</h2>
      <p class="s-sub">${sub}</p>
      <div class="s-sline" data-c="StepSummary">${lines}</div>
    </div>
    ${showPair ? `<div class="pair rev" data-c="ImagePair">
      <figure><div class="ph">${shot(st.selfie || 'live', { alt:'Your selfie' })}<span class="cnr"></span></div><figcaption><em>Your selfie${DEV() ? ' · images[0]' : ''}</em></figcaption></figure>
      <figure><div class="ph">${shot('doc', { alt:'Photo on your record' })}<span class="cnr"></span></div><figcaption><em>${esc(DOC().label)} photo${DEV() ? ' · images[1]' : ''}</em></figcaption></figure>
    </div>` : ''}
    ${cfg.showScore && L && L.score != null ? meter('Liveness score', L.score, 100, L.live === 'yes' ? (L.review === 'yes' ? 'wn' : 'ok') : 'bad', null, L.review === 'yes' ? 'Below the auto-accept floor' : L.live === 'yes' ? 'Comfortably live' : 'Presentation attack suspected') : ''}
    ${cfg.showScore && Mt && Mt.match != null ? meter('Match', Mt.match.toFixed(1), 100, Mt.status === 'MATCHED' ? 'ok' : 'bad', cfg.threshold, Mt.status === 'MATCHED' ? 'At or above the threshold' : 'Below the threshold') : ''}
    ${rev ? `<div class="rsn wn" data-c="ReviewNote">${svg(IC.users)}<div><b>Why a human is looking</b>${esc(L && L.review === 'yes' ? 'needToReview came back yes, so the result is not auto-accepted.' : 'The match is within five points of the threshold.')} ${cfg.reviewRoute ? 'The case is in ' + esc(preset().merchant) + '’s Face Forensics queue.' : 'Routing to a review queue is switched off for this merchant.'}</div></div>` : ''}
    ${!ok && !rev && m.attack ? `<div class="rsn bad" data-c="AttackNote">${svg(IC.warn)}<div><b>${esc({ photo:'Photo of a photo detected', replay:'Screen replay detected', print:'Printed photo detected', mask:'Mask detected' }[m.attack])}</b>Decentro returns the score and the verdict; naming the attack type here is this prototype’s own annotation for the demo.</div></div>` : ''}
    <div class="s-card" data-c="ReferenceCard">
      ${DEV()
        ? steps.map(s => { const d = st.steps[s] || {}; return `<div><span>${s === 'LIVE' ? 'Liveness' : 'Face match'} ref</span><b>${esc(d.ref || '—')}</b></div>
            <div><span>decentroTxnId</span><b>${esc(d.txn ? d.txn.slice(0, 18) + '…' : '—')}</b></div>`; }).join('')
        : `<div><span>Reference</span><b>${esc((st.steps[steps[0]] || {}).ref || '—')}</b></div>`}
      <div><span>Completed</span><b>${esc(stamp(nowIST()))} IST</b></div>
    </div>
    <div class="s-act">
      ${canRetake ? `<button class="s-btn pri" type="button" data-a="retake" data-c="PrimaryButton">Take another selfie</button>
        <button class="s-btn txt" type="button" data-a="close" data-c="TextButton">Back to ${esc(preset().merchant)}</button>`
      : `<button class="s-btn pri" type="button" data-a="close" data-c="PrimaryButton">Back to ${esc(preset().merchant)}</button>`}
    </div>`;
}
function errorBody(){
  const key = (st.steps.LIVE && st.steps.LIVE.err) || (st.steps.MATCH && st.steps.MATCH.err);
  const e = ERRS[key] || {}, ui = UI_ERR[key] || { t:'Something went wrong', b:'Please try again.' };
  const retryable = ['invalid_format','empty_image','timeout','credits','auth'].includes(key);
  return `
    <div class="s-center" style="padding-top:8px">
      <div class="r-ic bad pop" data-c="ResultIcon">${plain(IC.warn).replace('<svg', '<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"')}</div>
      <h2 class="r-h" data-c="ScreenTitle">${esc(ui.t)}</h2>
      <p class="s-sub">${esc(ui.b)}</p></div>
    ${DEV() ? `<div class="s-card" data-c="ReferenceCard">
      <div><span>What the merchant gets</span><b>onError(${esc(e.sdk || 'API_ERROR')})</b></div>
      <div><span>responseKey</span><b>${esc(e.key || '—')}</b></div>
      <div><span>HTTP · code</span><b>${esc((e.http || '—') + ' · ' + (e.code || '—'))}</b></div>
      <div><span>Time</span><b>${esc(stamp(nowIST()))} IST</b></div>
    </div>
    <div class="rsn wn" data-c="ErrorDetail">${svg(IC.warn)}<div><b>Developer view only</b>The applicant never sees a response key or an HTTP code — only the sentence above and one action. The key reaches the merchant through onError.</div></div>`
    : `<div class="s-card" data-c="ReferenceCard">
      <div><span>Time</span><b>${esc(stamp(nowIST()))} IST</b></div>
    </div>`}
    <div class="s-act">
      ${retryable ? `<button class="s-btn pri" type="button" data-a="retry" data-c="PrimaryButton">Try again</button>
        <button class="s-btn txt" type="button" data-a="close" data-c="TextButton">Back to ${esc(preset().merchant)}</button>`
      : `<button class="s-btn pri" type="button" data-a="close" data-c="PrimaryButton">Back to ${esc(preset().merchant)}</button>`}
    </div>`;
}

   CONTROLS

function buildJourneys(){
  $('#jlist').innerHTML = Object.keys(JOURNEYS).map(k => {
    const j = JOURNEYS[k];
    return `<button class="jc" type="button" data-j="${k}" aria-pressed="${st.j === k}">
      <span class="r1"><span class="chain">${j.chain.map(esc).join(' <i>→</i> ')}</span><span class="p ${j.p === 'P0' ? 'p0' : ''}">${j.p}</span></span>
      <span class="d">${esc(j.d)}</span></button>`;
  }).join('');
}
function buildOutcomes(){
  const sel = $('#outSel');
  sel.innerHTML = OUT_GROUP.map(([g, keys]) => {
    const list = keys.filter(k => OUT[k].j.includes(st.j));
    return list.length ? `<optgroup label="${esc(g)}">${list.map(k => `<option value="${k}" ${st.out === k ? 'selected' : ''}>${esc(OUT[k].n)}</option>`).join('')}</optgroup>` : '';
  }).join('');
  if (!OUT[st.out].j.includes(st.j)){
    st.out = OUT_GROUP.flatMap(([, k]) => k).find(k => OUT[k].j.includes(st.j));
    sel.value = st.out;
  }
  $('#outNote').textContent = OUT[st.out].note;
}
function buildCfg(){
  const d = st.mode === 'dev';
  const rows = [
    ['threshold', 'num', d ? 'Face Match threshold' : 'How close the faces must be',

function validateReq(){
  const el = $('#edStatus'); if (!el) return;
  let o, errs = [], warns = [];
  try { o = JSON.parse($('#reqEd').value); }
  catch(e){ el.className = 'ed-status bad'; el.innerHTML = `<b>JSON is not parseable</b><span>${esc(e.message)}</span>`; st.reqErr = ['parse']; return; }
  const J = Object.keys(JOURNEYS);
  if (!J.includes(o.journey)) errs.push(['journey', `must be one of ${J.join(', ')}`]);
  if (!o.reference_base) errs.push(['reference_base', 'required — reference IDs are built from it']);
  if (!o.consent || o.consent.given !== true) errs.push(['consent.given', 'must be true; the API returns error_consent_false otherwise']);
  const pl = (o.consent && o.consent.purpose || '').length;
  if (pl < 20 || pl > 50) errs.push(['consent.purpose', `${pl} characters — must be 20–50`]);
  if (o.face_match && o.face_match.enabled){
    const t = o.face_match.threshold;
    if (typeof t !== 'number' || t < 1 || t > 95) errs.push(['face_match.threshold', 'number from 1 to 95']);
    if (!['ON_FILE','CAPTURE'].includes(o.face_match.target)) errs.push(['face_match.target', 'ON_FILE or CAPTURE']);
    if (typeof t === 'number' && t > 90) warns.push('threshold above 90 rejects most genuine pairs taken years apart');
  }
  if (o.capture && typeof o.capture.auto !== 'boolean') errs.push(['capture.auto', 'boolean']);
  if (!['STAGING','PRODUCTION'].includes(o.environment)) errs.push(['environment', 'STAGING or PRODUCTION']);
  if (o.journey === 'MATCH' && o.liveness && o.liveness.enabled) warns.push('journey MATCH ignores liveness.enabled');
  st.reqErr = errs;
  if (errs.length){
    el.className = 'ed-status bad';
    el.innerHTML = `<b>${errs.length} schema error${errs.length === 1 ? '' : 's'} · Run fires onError(INVALID_REQUEST)</b>` +
      errs.map(([p, m]) => `<span><code>${esc(p)}</code> — ${esc(m)}</span>`).join('');
  } else {
    el.className = 'ed-status ok';
    el.innerHTML = `<b>Valid FFRequest · ${esc(JLABEL[o.journey])}</b>` + (warns.length ? warns.map(w => `<span class="w">${esc(w)}</span>`).join('') : '<span>Ready to run.</span>');
  }
}
function runRequest(){

  if (o.theme){ st.th.preset = PRESETS[o.theme.preset] ? o.theme.preset : st.th.preset; st.th.primary = o.theme.primary || null; st.th.dark = !!o.theme.dark; st.th.btnStyle = o.theme.button_style || null; st.th.btnCase = o.theme.button_case || null; }

  if (act === 'apply-mock'){
    const o = {};
    $$('#devSubBody [data-mk]').forEach(el => {
      const k = el.dataset.mk; let v = el.value;
      if (v === '') return;
      if (k === 'score' || k === 'match') v = +v;
      if (k === 'review') v = true;
      o[k] = v;
    });
    st.mockOverride = o; restart(); renderDevLeft();
    log('WARN', `<b>Mocks applied</b> · ${esc(Object.keys(o).join(', ') || 'defaults')}`);
    go('consent');
  }
  if (act === 'reset-mock'){ st.mockOverride = null; restart(); renderDevLeft(); log('SDK', '<b>Mocks reset</b> to the outcome selector'); }
  if (act === 'hoff-json') hoffJSON();
  if (act === 'hoff-md') hoffMD(a);
});
$('#devLeft').addEventListener('input', e => { if (e.target.id === 'reqEd'){ st.reqText = e.target.value; gutter(); validateReq(); } });
$('#devLeft').addEventListener('change', e => {
  if (e.target.id === 'exSel' && e.target.value){
    const [, fn] = EXAMPLES[e.target.value];
    st.reqText = JSON.stringify(fn(), null, 2);
    $('#reqEd').value = st.reqText; gutter(); validateReq(); e.target.value = '';
  }
});
$('#devLeft').addEventListener('keydown', e => {
  if (e.target.id !== 'reqEd') return;
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter'){ e.preventDefault(); runRequest(); return; }
  if (e.key === 'Tab'){ e.preventDefault(); const t = e.target, p = t.selectionStart;
    t.value = t.value.slice(0, p) + '  ' + t.value.slice(t.selectionEnd); t.selectionStart = t.selectionEnd = p + 2; gutter(); validateReq(); }
});

/* ---------- phone surface ---------- */
function onAction(act, el){
  if (act === 'start'){ st.preview = null; freshRun(); st.attempt = 1; log('SDK', `<b>startJourney()</b> · ${esc(JLABEL[st.j])} · ${esc(preset().merchant)}`); emit('onStep', { screen:'consent', step:1, of:FLOW(st.j).length, journey:st.j }); st.screen = 'consent'; $('#sdk').classList.add('open'); render(); renderAll(); return; }
  if (act === 'close'){ dismiss(); return; }
  if (act === 'decline'){ declineConsent(); return; }
  if (act === 'consent'){ if (!st.consentAt) return; go('guide'); return; }
  if (act === 'open-cam'){ go('cap'); return; }
  if (act === 'use'){ go(STEPS_OF(st.j).includes('MATCH') ? 'doc' : 'chk'); return; }
  if (act === 'retake'){ st.attempt++; st.selfie = null; st.steps = {}; st.result = null; st.chk = null;
    if (M().retake || M().face) st.mock = { ...st.mock, retake:false };
    log('SDK', `<b>Retake</b> · attempt ${st.attempt} of 3`); go('cap'); return; }
  if (act === 'src-file'){ cfg.docSource = 'on_file'; buildCfg(); render(); return; }
  if (act === 'src-cap'){ cfg.docSource = 'capture'; buildCfg(); render(); return; }
  if (act === 'doc-next'){ go(cfg.docSource === 'capture' ? 'doccap' : 'chk'); return; }
  if (act === 'retry'){ st.attempt++; st.steps = {}; st.result = null; st.chk = null; st.retried = false;
    st.mock = { ...st.mock, api:M().api === 'timeout' ? 'timeout' : null };
    log('SDK', '<b>Retry</b> · a fresh reference ID is issued for the failed step'); go('chk'); return; }
  if (act === 'settings'){ toast(st.os === 'ios' ? 'Deep-links to Settings → Privacy → Camera' : 'Deep-links to App info → Permissions → Camera'); return; }
  if (act === 'camx'){ askCancel(); return; }
  if (act === 'shutter'){ clearTimers(); capture(); return; }
  if (act === 'stay'){ closeOverlays(); return; }
  if (act === 'leave'){ closeOverlays(); emit('onCancelled', { reason:'USER_EXIT', screen:st.screen }); st.screen = 'app'; $('#sdk').classList.remove('open'); $('#camS').hidden = true; render(); renderAll(); return; }
}
/* #sdk covers the header, body and footer — the close X lives in the header,
   so listening on #sbody alone left it dead. */
['#host','#sdk','#camS','#dlg','#sheet'].forEach(sel => $(sel).addEventListener('click', e => {
  if (st.inspect) return;
  const cb = e.target.closest('#cBox');
  if (cb){ st.consentAt = st.consentAt ? null : nowIST();
    log('SDK', st.consentAt ? '<b>Consent given</b> · ' + esc(stamp(st.consentAt)) + ' IST' : '<b>Consent unticked</b>');
    render(); return; }
  const a = e.target.closest('[data-a]'); if (a) onAction(a.dataset.a, a);
}));
$('#scrim').addEventListener('click', closeOverlays);


/* ---------- inspector + keyboard ---------- */
$('#vp').addEventListener('mousemove', e => { if (!st.inspect || st.pin) return; inspectAt(e.target.closest('[data-c]'), e); });
$('#vp').addEventListener('mouseleave', () => { if (st.inspect && !st.pin){ $('#inspBox').hidden = true; $('#inspTip').hidden = true; } });
$('#vp').addEventListener('click', e => { if (!st.inspect) return; e.preventDefault(); e.stopPropagation();
  const el = e.target.closest('[data-c]'); st.pin = st.pin === el ? null : el; inspectAt(el, e); }, true);
document.addEventListener('keydown', e => {
  const typing = e.target.closest && e.target.closest('input, textarea, select, [contenteditable]');
  if (e.key === 'Escape'){ if (st.inspect) return setInspect(false); if ($('#dlg').classList.contains('on')) return closeOverlays(); }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (st.mode === 'dev' && (e.key === 'i' || e.key === 'I')) setInspect(!st.inspect);
});

/* ============================================================
   TEST HOOK  (Decentro-Demo.MD §6.9)
   ============================================================ */
window.DEMO = {
  screens: () => Object.keys(SCREENS),
  outcomes: () => Object.keys(OUT),
  go: id => {
    clearTimers();
    st.preview = null;
    if (!SCREENS[id]) return;
    if (id === 'res'){ buildSampleResult(); st.preview = null; st.screen = 'res'; }
    else if (id === 'err'){ st.steps.LIVE = { status:'ERROR', err:'invalid_format', ref:P.base + 'LIVE1' }; st.screen = 'err'; }
    else { st.screen = id; }
    if (id === 'rev' || id === 'res') st.selfie = st.selfie || 'live';
    if (id === 'chk') st.chk = { up:'done', LIVE:'active', MATCH:'wait' };
    $('#sdk').classList.toggle('open', id !== 'app');
    $('#camS').hidden = id !== 'cap' && id !== 'doccap';
    render(); renderSpec(); fit();
  },
  setOutcome: k => { if (!OUT[k]) return; st.out = k; if (!OUT[k].j.includes(st.j)) st.j = OUT[k].j[0]; syncControls(); restart(); },
  reset: () => restart(),
  handoff: () => handoff()
};

/* ============================================================
   BOOT
   ============================================================ */
buildPresets(); syncControls(); freshRun(); theme(); buildTabs(); renderDevLeft(); restart(); fit();
log('SDK', '<b>Face Forensics prototype ready</b> · Farsight Passive Liveness + Face Match', 'Decentro-Demo.MD v1.0 · data is mock · IST');
if (location.hash === '#dev') setMode('dev');
requestAnimationFrame(fit);
document.fonts && document.fonts.ready.then(fit);
</script>

      set:function(v){ var b=document.querySelector('header.top [data-v="'+v+'"]'); if(b) b.click(); } },

<script>
/* ══ Demo Hub bridge · 29 Oct 2026 ══════════════════════════════════════════
   Opened from file://, every iframe gets an opaque origin, so the hub cannot
   touch this document and its reach-in Demo fill silently fails. The hub then
   asks over postMessage instead — this is the half that answers. Same code
   serves http, so behaviour is identical either way. */
(function(){
  if (window.__dcnBridge) return; window.__dcnBridge = 1;

  var RULES = [
    [/otp|passcode|\bpin\b/i,            '482913'],
    [/mobile|phone|contact|msisdn|tel/i, '9876543210'],
    [/e-?mail/i,                         'rakesh.sharma@example.in'],
    [/\bpan\b/i,                         'ABCDE1234F'],
    [/ifsc/i,                            'HDFC0001205'],
    [/upi|vpa|handle/i,                  'rakesh.sharma@okhdfcbank'],
    [/account.*(number|no)|acc.*num/i,   '50100412887201'],
    [/passport/i,                        'Z4821907'],
    [/aadhaar|uid/i,                     '9821'],
    [/pin ?code|postal|zip/i,            '560025'],
    [/first.*name|given/i,               'Rakesh'],
    [/middle/i,                          'Kumar'],
    [/last.*name|surname|family/i,       'Sharma'],
    [/company|business|merchant|entity/i,'Aurora & Co.'],
    [/\bcity\b/i,                        'Bengaluru'],
    [/\bstate\b/i,                       'Karnataka'],
    [/address|street|line ?1/i,          '12 Residency Road'],
    [/amount|value|price/i,              '2499'],
    [/\bdate\b|dob|birth/i,              '1991-04-12'],
    [/\bname\b/i,                        'Rakesh Sharma'],
    [/reference|ref ?id|order/i,         'DEC20261029001']
  ];

  function hint(el){
    var t = [el.id, el.name, el.getAttribute('placeholder') || '',
             el.getAttribute('aria-label') || '', el.className || ''].join(' ');
    try{
      var lab = (el.id && document.querySelector('label[for="' + CSS.escape(el.id) + '"]')) || el.closest('label');
      if(lab) t += ' ' + lab.textContent;
      var fld = el.closest('.fld,.field,.form-row,.b-field,.inp');
      if(fld) t += ' ' + (fld.textContent || '').slice(0, 80);
    }catch(e){}
    return t;
  }
  function valueFor(el){
    var type = (el.getAttribute('type') || 'text').toLowerCase();
    if(type === 'date') return '1991-04-12';
    if(type === 'email') return 'rakesh.sharma@example.in';
    if(type === 'tel') return '9876543210';
    /* single-character boxes are OTP/PIN digits */
    if(el.maxLength === 1) return String(Math.floor(Math.random() * 10));
    var h = hint(el);
    for(var i = 0; i < RULES.length; i++) if(RULES[i][0].test(h)) return RULES[i][1];
    var ph = (el.getAttribute('placeholder') || '').replace(/^(e\.?g\.?|example|sample)[:.\s]*/i, '').trim();
    if(ph && !/^(enter|type|select|choose|search|add)\b/i.test(ph)) return ph;
    if(type === 'number') return '100';
    return 'Demo value';
  }
  /* React and friends track value on the node, so poke the native setter */
  function setVal(el, v){
    var proto = el.tagName === 'TEXTAREA' ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype;
    var d = Object.getOwnPropertyDescriptor(proto, 'value');
    if(d && d.set) d.set.call(el, v); else el.value = v;
    ['input','change','keyup','blur'].forEach(function(ev){
      el.dispatchEvent(new Event(ev, {bubbles:true}));
    });
  }
  function visible(el){
    if(el.offsetParent === null && getComputedStyle(el).position !== 'fixed') return false;
    var r = el.getBoundingClientRect();
    return r.width > 8 && r.height > 6;
  }

  function fill(){
    var n = 0;
    var els = document.querySelectorAll(
      'input:not([type=hidden]):not([type=button]):not([type=submit]):not([type=file]),textarea,select');
    Array.prototype.forEach.call(els, function(el){
      if(el.disabled || el.readOnly || !visible(el)) return;
      var type = (el.getAttribute('type') || '').toLowerCase();
      if(type === 'checkbox' || type === 'radio'){
        if(!el.checked){ el.click(); n++; }      /* consents gate the primary action */
        return;
      }
      if(el.tagName === 'SELECT'){
        if(el.selectedIndex > 0) return;
        var opt = Array.prototype.filter.call(el.options, function(o){ return o.value && !o.disabled; })[0];
        if(opt){ el.value = opt.value; el.dispatchEvent(new Event('change', {bubbles:true})); n++; }
        return;
      }
      if((el.value || '').trim()) return;
      setVal(el, valueFor(el)); n++;
    });
    /* a flow that ships its own sample data knows its persona better than we do */
    if(!n){
      var own = window.prefill || window.useSample || window.fillSample;
      if(typeof own === 'function'){ try{ own(true); return -1; }catch(e){} }
      var btn = Array.prototype.filter.call(
        document.querySelectorAll('button,[onclick],.btn'),
        function(b){ return /use sample|sample details|fill sample|demo data/i.test(b.innerText || ''); })[0];
      if(btn && visible(btn)){ btn.click(); return -1; }
    }
    return n;
  }

  function send(msg){
    msg.source = 'decentro-demo';
    try{ parent.postMessage(msg, '*'); }catch(e){}
  }

  addEventListener('message', function(ev){
    var d = ev.data;
    if(!d || d.source !== 'decentro-hub') return;
    if(d.type === 'fill'){
      var n = fill();
      /* some screens repaint on input and recreate fields empty */
      setTimeout(function(){
        var more = fill();
        var total = (n < 0 || more < 0) ? -1 : n + (more > 0 ? more : 0);
        send({type:'fill-result', n: total});
      }, 260);
    }
  });

  addEventListener('keydown', function(e){ if(e.key === 'Escape') send({type:'escape'}); });

  /* report the visible screen so the hub's backend trace follows along */
  var lastScreen = null;
  function reportScreen(){
    var el = document.querySelector('.screen.active,.screen.on,[class*=screen].active,section.active');
    var id = el && el.id;
    if(id && id !== lastScreen){ lastScreen = id; send({type:'screen', screen:id}); }
  }
  setInterval(reportScreen, 400);

  if(document.readyState === 'loading')
    addEventListener('DOMContentLoaded', function(){ send({type:'ready'}); reportScreen(); });
  else { send({type:'ready'}); reportScreen(); }
})();
</script>
