<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Decentro Farsight · Face Forensics Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: presenter shell — journey controls | live device | developer handoff panel.
   Design language: Decentro UI Demos zinc system (black / white / grey, shadcn token names).
   The device is themed only by the merchant's SDK theme; "Decentro default" uses the same zinc palette. */
:root{
  --bg:#fafafa; --panel:#ffffff; --panel-2:#f4f4f5; --fg:#09090b; --fg-2:#71717a; --fg-3:#a1a1aa;
  --line:#e4e4e7; --line-2:#d4d4d8; --accent:#09090b; --accent-soft:#f4f4f5; --accent-fg:#fafafa; --hover:#27272a;
  --ok:#166534; --ok-soft:#f0fdf4; --ok-bd:#bbf7d0; --warn:#92400e; --warn-soft:#fffbeb; --warn-bd:#fde68a; --err:#991b1b; --err-soft:#fef2f2; --err-bd:#fecaca;
  --t-scr:#a1a1aa; --t-api:#09090b; --t-poll:#52525b; --t-tok:#b45309;
  --code-bg:#fafafa; --code-fg:#3f3f46; --j-key:#09090b; --j-str:#52525b; --j-num:#09090b; --j-lit:#71717a;
  --bezel:#09090b; --bezel-edge:#3f3f46; --scrim:rgba(9,9,11,.4); --ring:rgba(9,9,11,.08);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --fs-h:clamp(18px,2.7vh,25px); --fs-t:clamp(12.5px,1.62vh,14px); --fs-b:clamp(12px,1.5vh,13.5px);
  --fs-s:clamp(10.5px,1.25vh,11.5px); --fs-c:clamp(10px,1.22vh,11.5px); --lh:1.6; --g:clamp(9px,1.35vh,16px);
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09090b; --panel:#0f0f11; --panel-2:#18181b; --fg:#fafafa; --fg-2:#a1a1aa; --fg-3:#71717a;
  --line:#27272a; --line-2:#3f3f46; --accent:#fafafa; --accent-soft:#18181b; --accent-fg:#09090b; --hover:#e4e4e7;
  --ok:#86efac; --ok-soft:#0d1f14; --ok-bd:#14532d; --warn:#fcd34d; --warn-soft:#1f1708; --warn-bd:#713f12; --err:#fca5a5; --err-soft:#231010; --err-bd:#7f1d1d;
  --t-scr:#71717a; --t-api:#fafafa; --t-poll:#a1a1aa; --t-tok:#fbbf24;
  --code-bg:#0c0c0e; --code-fg:#d4d4d8; --j-key:#fafafa; --j-str:#a1a1aa; --j-num:#fafafa; --j-lit:#71717a;
  --bezel:#000000; --bezel-edge:#3f3f46; --scrim:rgba(0,0,0,.6); --ring:rgba(250,250,250,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090b; --panel:#0f0f11; --panel-2:#18181b; --fg:#fafafa; --fg-2:#a1a1aa; --fg-3:#71717a;
  --line:#27272a; --line-2:#3f3f46; --accent:#fafafa; --accent-soft:#18181b; --accent-fg:#09090b; --hover:#e4e4e7;
  --ok:#86efac; --ok-soft:#0d1f14; --ok-bd:#14532d; --warn:#fcd34d; --warn-soft:#1f1708; --warn-bd:#713f12; --err:#fca5a5; --err-soft:#231010; --err-bd:#7f1d1d;
  --t-scr:#71717a; --t-api:#fafafa; --t-poll:#a1a1aa; --t-tok:#fbbf24;
  --code-bg:#0c0c0e; --code-fg:#d4d4d8; --j-key:#fafafa; --j-str:#a1a1aa; --j-num:#fafafa; --j-lit:#71717a;
  --bezel:#000000; --bezel-edge:#3f3f46; --scrim:rgba(0,0,0,.6); --ring:rgba(250,250,250,.12); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overflow:clip}
.app{width:100%;overflow:hidden;overflow:clip}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:var(--fs-b);line-height:var(--lh);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono)}

/* ── shell ── */
.app{height:100%;display:flex;flex-direction:column}
.top{flex:none;height:54px;display:flex;align-items:center;gap:12px;padding-inline:16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg.logo{width:92px;height:18px;color:var(--fg);flex:none}
.brand .sep{width:1px;height:20px;background:var(--line-2)}
.brand b{font-size:var(--fs-t);font-weight:600;white-space:nowrap}
.brand .tag{font-size:var(--fs-s);color:var(--fg-2);border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;white-space:nowrap}
.top .sp{flex:1}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:var(--fs-s);font-weight:600;color:var(--fg-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(9,9,11,.06),0 0 0 1px var(--line)}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 12px;font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s}
.tbtn:hover{background:var(--panel-2)}
.tbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tbtn.pri:hover{background:var(--hover)}
#btnCtl,#btnDev{display:none}

.main{flex:1;min-height:0;display:grid;grid-template-columns:304px minmax(0,1fr) 420px}
.ctl,.dev{min-height:0;background:var(--panel);display:flex;flex-direction:column}
.ctl{border-right:1px solid var(--line);overflow:auto;padding:14px 16px 20px;gap:18px}
.dev{border-left:1px solid var(--line)}

/* ── controls ── */
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:var(--fs-s);font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3)}
.jgrp{font-size:var(--fs-s);color:var(--fg-3);margin-top:2px}
.jl{display:flex;flex-direction:column;gap:6px}
.jc{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:8px 10px}
.jc:hover{border-color:var(--line-2);background:var(--panel-2)}
.jc[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.jc .r1{display:flex;align-items:center;gap:6px}
.jc .chain{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:var(--fs-c);font-weight:500}
.jc .chain i{font-style:normal;color:var(--fg-3)}
.jc .p{margin-left:auto;font-size:10px;font-weight:600;border-radius:5px;padding:0 6px;background:var(--panel-2);color:var(--fg-2);border:1px solid var(--line)}
.jc .p.p0{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.jc .d{font-size:var(--fs-s);color:var(--fg-2);line-height:1.4}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>label,.fld>.lb{font-size:var(--fs-s);color:var(--fg-2);font-weight:500}
.sel{width:100%;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 8px;font-size:var(--fs-b)}
.row2{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 10px;font-size:var(--fs-b)}
.row2 .lb{color:var(--fg);}
.row2 small{display:block;color:var(--fg-3);font-size:var(--fs-s);line-height:1.35}
.sw{position:relative;width:34px;height:20px;flex:none;border-radius:999px;background:var(--line-2);border:0;padding:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--fg)}
.sw[aria-checked="true"]::after{transform:translateX(14px)}
.num{width:64px;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--panel);font-variant-numeric:tabular-nums}
.ctx-note{font-size:var(--fs-s);color:var(--fg-3);line-height:1.45}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pc{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;background:var(--panel);text-align:left;font-size:var(--fs-s);font-weight:500;min-width:0}
.pc[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.pc .dot{width:18px;height:18px;border-radius:5px;flex:none;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;box-shadow:0 0 0 1px var(--line) inset}
.pc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colorrow{display:flex;align-items:center;gap:8px}
.colorrow input[type=color]{width:34px;height:28px;border:1px solid var(--line-2);border-radius:7px;padding:2px;background:var(--panel)}
.cwarn{font-size:var(--fs-s);color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-bd);border-radius:8px;padding:6px 9px;line-height:1.45}

/* ── stage ── */
.stage{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 16px 12px}
.flowbar{display:flex;align-items:center;justify-content:flex-start;flex-wrap:nowrap;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.flowbar::-webkit-scrollbar{display:none}
.flowbar>:first-child{margin-left:auto}.flowbar>:last-child{margin-right:auto}
.fchip{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-s);font-weight:500;color:var(--fg-3);padding:3px 8px;flex:none;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.fchip .n{width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--fg-2);background:var(--panel)}
.fchip.done{color:var(--fg-2)}
.fchip.done .n{background:var(--panel-2);border-color:var(--line);color:var(--fg)}
.fchip.cur{color:var(--fg);font-weight:600}
.fchip.cur .n{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.fchip.cur.bad{color:var(--err)}
.fchip.cur.bad .n{background:var(--err);border-color:var(--err);color:var(--bg)}
.farr{width:18px;height:1px;background:var(--line-2);flex:none;font-size:0}
.pwrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center}
.sizer{position:relative;flex:none}
.caption{max-width:560px;text-align:center;font-size:var(--fs-b);color:var(--fg-2);line-height:1.5;min-height:1.5em;text-wrap:balance}
.ptools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* ── device ──
   Two real-hardware frames. Screen sizes are the platforms' own logical sizes:
   iPhone 15 Pro 393×852 pt · Pixel 8 412×892 dp (915 minus the gesture area). */
.device{--sw:393px;--sh:852px;--bz:11px;--bd:4px;--ro:67px;--rs:55px;
  position:absolute;left:5px;top:0;transform-origin:0 0;
  width:calc(var(--sw) + 2*(var(--bz) + var(--bd)));height:calc(var(--sh) + 2*(var(--bz) + var(--bd)));
  border-radius:var(--ro);padding:var(--bd);
  background:linear-gradient(140deg,#6a6c71 0%,#2b2c30 16%,#76787d 34%,#303135 52%,#5e6065 72%,#232427 88%,#55575c 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 0 0 1px rgba(0,0,0,.55),0 50px 90px -40px rgba(0,0,0,.55),0 18px 36px -18px rgba(0,0,0,.35)}
.device[data-os="android"]{--sw:412px;--sh:892px;--bz:9px;--bd:4px;--ro:50px;--rs:38px;
  background:linear-gradient(140deg,#45474c 0%,#1d1e21 22%,#3b3d41 48%,#17181a 70%,#36383c 100%)}
.bezel{position:relative;height:100%;border-radius:calc(var(--ro) - var(--bd));background:#000;padding:var(--bz);box-shadow:inset 0 0 0 1.5px #1b1b1d}
/* hardware buttons */
.hw{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#1f2023,#5f6166 50%,#1f2023);display:block}
.hw.l{left:-3px} .hw.r{right:-3px}
.device[data-os="ios"] .hw1{top:132px;height:32px}
.device[data-os="ios"] .hw2{top:196px;height:64px}
.device[data-os="ios"] .hw3{top:272px;height:64px}
.device[data-os="ios"] .hw4{top:236px;height:104px}
.device[data-os="android"] .hw1,.device[data-os="android"] .hw2{display:none}
.device[data-os="android"] .hw3{top:178px;height:62px;left:auto;right:-3px}
.device[data-os="android"] .hw4{top:270px;height:118px}
.scr{position:relative;width:100%;height:100%;border-radius:var(--rs);overflow:hidden;display:flex;flex-direction:column;background:var(--s-bg);color:var(--s-tx);font-family:var(--s-font);font-size:14px;line-height:1.45;isolation:isolate}
/* status bar */
.sbar{flex:none;position:relative;z-index:30;background:var(--sbar-bg,var(--s-bg));color:var(--sbar-fg,var(--s-tx));transition:background .3s;font-variant-numeric:tabular-nums}
.sbar svg{fill:currentColor;stroke:none;display:block}
.device[data-os="ios"] .sbar{height:54px;display:grid;grid-template-columns:1fr 126px 1fr;align-items:center;padding-top:4px;font:600 17px/1 -apple-system,'SF Pro Text','Inter',sans-serif;letter-spacing:-.2px}
.device[data-os="ios"] .clk{justify-self:center;padding-left:6px}
.device[data-os="ios"] .ic-ios{grid-column:3;justify-self:center;display:flex;gap:6px;align-items:center;padding-right:4px}
.device[data-os="ios"] .ic-and{display:none}
.device[data-os="android"] .sbar{height:38px;display:flex;align-items:center;justify-content:space-between;padding:2px 24px 0 26px;font:500 14px/1 'Roboto','Inter',sans-serif;letter-spacing:.1px}
.device[data-os="android"] .ic-ios{display:none}
.device[data-os="android"] .ic-and{display:flex;gap:7px;align-items:center}
.ic-ios .sig{width:18px;height:12px} .ic-ios .wifi{width:16px;height:12px} .ic-ios .bat{width:27px;height:13px}
.ic-and .wifi{width:15px;height:12px} .ic-and .sig{width:13px;height:13px} .ic-and .bat{width:8px;height:14px}
/* camera cut-outs, drawn on the glass above everything */
.cam{position:absolute;left:50%;transform:translateX(-50%);background:#000;z-index:60;pointer-events:none}
.device[data-os="ios"] .cam{top:11px;width:126px;height:37px;border-radius:20px}
.device[data-os="ios"] .cam::after{content:"";position:absolute;right:15px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2a3550 0 22%,#0b0d14 45%,#050507 70%)}
.device[data-os="android"] .cam{top:11px;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 38% 38%,#1f2a40 0 18%,#07080c 50%,#000 72%);box-shadow:0 0 0 1.5px #0a0a0b}
.vp{position:relative;flex:1;min-height:0;overflow:hidden;overflow:clip}
.scr.ho .sbar,.scr.ho .nbar{background:#09090b;color:#fafafa}
.scr.ho .nbar i{background:#fafafa}
/* home indicator / gesture bar */
.nbar{flex:none;display:flex;justify-content:center;background:var(--nbar-bg,var(--s-bg));position:relative;z-index:30}
.nbar i{display:block;border-radius:3px;background:var(--s-tx)}
.device[data-os="ios"] .nbar{height:34px;align-items:flex-end;padding-bottom:8px}
.device[data-os="ios"] .nbar i{width:134px;height:5px;opacity:.92}
.device[data-os="android"] .nbar{height:24px;align-items:center}
.device[data-os="android"] .nbar i{width:108px;height:4px;opacity:.55;border-radius:2px}
/* glass sheen */
.bezel::after{content:"";position:absolute;inset:var(--bz);border-radius:var(--rs);pointer-events:none;z-index:70;background:linear-gradient(115deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 28%)}

/* full-bleed on phones: the page is the device */
body.fb .stage{padding:0;gap:0}
body.fb .flowbar,body.fb .caption,body.fb .ptools{display:none}
body.fb .pwrap{align-items:stretch}
body.fb .sizer{width:100%!important;height:100%!important}
body.fb .device{position:static;width:100%;height:100%;transform:none!important;border-radius:0;padding:0;box-shadow:none;background:transparent}
body.fb .bezel{padding:0;border-radius:0;background:transparent;box-shadow:none}
body.fb .bezel::after{display:none}
body.fb .scr{border-radius:0}
body.fb .sbar,body.fb .nbar,body.fb .cam,body.fb .hw{display:none!important}

/* ── host (merchant) app ── */
.host{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--h-bg);color:var(--s-tx)}
.h-bar{display:flex;align-items:center;gap:10px;padding:12px 20px}
.h-bar b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.h-tag{margin-left:auto;font:500 10.5px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--s-tx2);border:1px dashed var(--s-tx2);border-radius:6px;padding:4px 6px}
.h-body{flex:1;display:flex;flex-direction:column;gap:14px;padding:8px 20px 20px;min-height:0}
.h-hero{border-radius:var(--card-r);background:var(--s-p);color:var(--s-onp);padding:18px;display:flex;flex-direction:column;gap:6px}
.h-hero small{opacity:.8;font-size:12px;font-weight:500;letter-spacing:.02em}
.h-hero b{font-size:22px;line-height:1.2;letter-spacing:-.015em}
.h-card{border:1px solid var(--s-bd);background:var(--s-bg);border-radius:var(--card-r);padding:16px;display:flex;flex-direction:column;gap:6px}
.h-card h4{margin:0;font-size:16px}
.h-card p{margin:0;color:var(--s-tx2);font-size:13.5px}
.h-res{display:flex;flex-direction:column;gap:8px}
.h-res .st{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px}
.h-res .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.h-res .kv span{color:var(--s-tx2)}
.h-res .kv b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.h-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.h-cb{font:500 11px/1.5 var(--mono);color:var(--s-tx2);text-align:center}

/* ── SDK chrome ── */
.sdk{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--s-bg);transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.8,.2,1);z-index:10}
.sdk.open{transform:none}
.s-head{flex:none;display:flex;align-items:center;gap:11px;padding:10px 18px 12px 20px;border-bottom:1px solid var(--s-bd)}
.s-logo{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--s-p);color:var(--s-onp);flex:none}
.s-head b{font-size:15px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-x{width:34px;height:34px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--s-tx)}
.s-x:hover{background:var(--s-surf)}
.s-x svg{width:20px;height:20px}
.s-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:22px 20px 14px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.s-body::-webkit-scrollbar{display:none}
.s-foot{flex:none;text-align:center;padding:8px 0 10px;font-size:11.5px;color:var(--s-tx2);display:flex;align-items:center;justify-content:center;gap:6px}
.s-foot svg{width:70px;height:13px;color:var(--s-tx)}
.s-act{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:6px}
.s-title{font-size:var(--s-ts);font-weight:700;letter-spacing:-.015em;line-height:1.25;margin:0;text-wrap:balance}
.s-sub{color:var(--s-tx2);font-size:var(--s-bs);margin:0}
.s-cap{font-size:var(--s-cs);color:var(--s-tx2)}
.s-center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}

.s-btn{height:var(--btn-h);border-radius:var(--btn-r);border:1px solid var(--s-p);background:var(--s-p);color:var(--s-onp);font-weight:600;font-size:15px;letter-spacing:-.005em;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:filter .15s,opacity .15s}

.device.btn-outlined .s-btn.pri{background:transparent;color:var(--s-p)}
.s-btn:hover{filter:brightness(1.12)}
.s-btn:active{transform:scale(.985)}
.s-btn.dis{background:var(--s-dis);border-color:var(--s-dis);color:var(--s-dis-tx);filter:none;transform:none}
.device.btn-outlined .s-btn.pri.dis{background:transparent;border-color:var(--s-bd);color:var(--s-tx2)}
.s-btn.sec{background:transparent;color:var(--s-tx);border-color:var(--s-bd)}
.s-btn.txt{background:transparent;border-color:transparent;color:var(--s-tx);height:40px}
.s-btn .spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite}
.s-link{background:none;border:0;color:var(--s-tx);font-weight:600;padding:4px;font-size:14.5px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--s-tx2)}
.s-link-inline{color:var(--s-tx);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--s-tx2)}

.s-num{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.s-num li{display:flex;align-items:center;gap:12px;font-size:var(--s-bs)}
.s-num li i{font-style:normal;width:26px;height:26px;border-radius:50%;border:1px solid var(--s-bd);display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--s-tx2);flex:none}
.s-note{background:var(--s-surf);border:1px solid var(--s-bd);border-radius:var(--card-r);padding:12px 14px;font-size:13.5px;color:var(--s-tx);display:flex;gap:10px;align-items:flex-start}
.s-note svg{width:18px;height:18px;color:var(--s-p);margin-top:1px}
.s-chk{display:flex;gap:11px;align-items:flex-start;font-size:13.5px;line-height:1.5;cursor:pointer;user-select:none}
.s-chk .bx{width:20px;height:20px;border-radius:5px;border:1px solid var(--s-tx);flex:none;margin-top:1px;display:grid;place-items:center;transition:all .12s}
.s-chk .bx svg{width:14px;height:14px;color:var(--s-onp);opacity:0;stroke-width:3}
.s-chk.on .bx{background:var(--s-p);border-color:var(--s-p)}
.s-chk.on .bx svg{opacity:1}
.s-chk.bad .bx{border-color:var(--s-err)}
.s-err{color:var(--s-err);font-size:12.5px;line-height:1.35}

.s-f{display:flex;flex-direction:column;gap:6px}
.s-f label{font-size:13px;font-weight:600}
.s-f label em{font-style:normal;font-weight:500;color:var(--s-tx2)}
.s-in{position:relative;display:flex;align-items:center}
.s-in input{width:100%;height:48px;border-radius:var(--in-r);border:1px solid var(--s-bd);background:var(--s-in-bg);padding:0 15px;font-size:16px;color:var(--s-tx);font-family:inherit;outline:none;transition:border-color .12s,box-shadow .12s}
.device.in-filled .s-in input{border-color:transparent}
.s-in input::placeholder{color:var(--s-tx2);opacity:.75}
.s-in input:focus{border-color:var(--s-in-focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--s-in-focus) 9%,transparent)}
.s-in.bad input{border-color:var(--s-err);box-shadow:0 0 0 3px color-mix(in srgb,var(--s-err) 8%,transparent)}
.s-in.lock input{background:var(--s-surf);color:var(--s-tx2);border-color:var(--s-bd);padding-right:44px}
.s-in .lk{position:absolute;right:14px;width:18px;height:18px;color:var(--s-tx2)}
.s-ro{background:var(--s-surf);border-radius:var(--card-r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.s-ro div{display:flex;flex-direction:column;gap:1px}
.s-ro span{font-size:12.5px;color:var(--s-tx2)}
.s-ro b{font-size:15px;font-weight:600}
.s-attempt{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:600;color:var(--s-tx2);background:var(--s-surf);border-radius:999px;padding:2px 10px}

.s-pay{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.s-pay b{font-size:22px;font-weight:700;letter-spacing:-.02em;display:block;font-variant-numeric:tabular-nums}
.s-pill{display:inline-flex;align-items:center;gap:6px;background:var(--s-surf);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.s-pill svg{width:15px;height:15px;color:var(--s-tx2)}
.s-pill.low{color:var(--s-err)}
.s-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.s-tile{border:1px solid var(--s-bd);border-radius:var(--card-r);background:var(--s-bg);padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--s-tx);transition:border-color .12s,transform .12s}
.s-tile:hover{border-color:var(--s-tx);background:var(--s-surf)}
.s-tile:active{transform:scale(.98)}
.mono-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--s-surf);color:var(--s-tx);font-weight:700;font-size:13px;letter-spacing:-.02em;border:1px solid var(--s-bd)}
.s-other{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--s-bd);border-radius:var(--card-r);background:transparent;padding:14px 16px;color:var(--s-p);font-weight:600;font-size:14.5px;width:100%}
.s-other svg{width:18px;height:18px}

.spinner{width:72px;height:72px;border-radius:50%;border:5px solid var(--s-bd);border-top-color:var(--s-tx);animation:rot 1s linear infinite}
.spinner.sm{width:22px;height:22px;border-width:3px}
@keyframes rot{to{transform:rotate(360deg)}}

.s-prog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.s-prog li{display:flex;gap:14px;position:relative;padding-bottom:22px}
.s-prog li:last-child{padding-bottom:0}
.s-prog li::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--s-bd)}
.s-prog li:last-child::before{display:none}
.s-prog li.done::before{background:var(--s-p)}
.pi{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;border:1px solid var(--s-bd);background:var(--s-bg);position:relative;z-index:1}
.pi svg{width:15px;height:15px;stroke-width:3}
li.done .pi{background:var(--s-p);border-color:var(--s-p);color:var(--s-onp)}
li.active .pi{border:2px dashed var(--s-tx);animation:rot 2.4s linear infinite}
li.pend .pi{border-color:var(--s-warn);color:var(--s-warn)}
li.fail .pi{border-color:var(--s-err);color:var(--s-err)}
.s-prog b{display:block;font-size:15px;font-weight:600}
.s-prog small{font-size:13px;color:var(--s-tx2)}
li.active small{color:var(--s-tx);font-weight:500}
li.pend small{color:var(--s-warn);font-weight:500}

.r-ic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin-top:6px}
.r-ic svg{width:34px;height:34px;stroke-width:2.4}
.r-ic.ok{background:color-mix(in srgb,var(--s-ok) 10%,var(--s-bg));color:var(--s-ok);box-shadow:0 0 0 1px color-mix(in srgb,var(--s-ok) 35%,transparent) inset}
.r-ic.bad{background:color-mix(in srgb,var(--s-err) 9%,var(--s-bg));color:var(--s-err);box-shadow:0 0 0 1px color-mix(in srgb,var(--s-err) 35%,transparent) inset}
.r-ic.wn{background:color-mix(in srgb,var(--s-warn) 10%,var(--s-bg));color:var(--s-warn);box-shadow:0 0 0 1px color-mix(in srgb,var(--s-warn) 35%,transparent) inset}
.r-ic.tri{background:transparent;box-shadow:none;color:var(--s-warn)}
.r-ic.tri svg{width:64px;height:64px;stroke-width:1.8}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.r-h{font-size:var(--s-ts);font-weight:700;letter-spacing:-.015em;line-height:1.25;margin:0;text-wrap:balance;max-width:290px}
.s-call{background:var(--s-surf);border:1px solid var(--s-bd);border-radius:var(--card-r);padding:13px 16px;text-align:left;width:100%;font-size:14px;line-height:1.45}
.s-call b{display:block;font-weight:600}
.s-call span{color:var(--s-tx2)}
.s-card{border:1px solid var(--s-bd);border-radius:var(--card-r);padding:6px 16px;width:100%}
.s-card div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px}
.s-card div+div{border-top:1px solid color-mix(in srgb,var(--s-bd) 60%,transparent)}
.s-card span{color:var(--s-tx2)}
.s-card b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;word-break:break-all}
.s-sline{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:13.5px;font-weight:500}
.s-sline span{display:inline-flex;align-items:center;gap:4px}
.s-sline svg{width:14px;height:14px;stroke-width:3}
.s-sline .ok{color:var(--s-ok)} .s-sline .bad{color:var(--s-err)} .s-sline .wn{color:var(--s-warn)} .s-sline .nr{color:var(--s-tx2);opacity:.7}
.s-refund{font-size:13px;color:var(--s-tx2);text-align:center}


/* payment options — production checkout component (decentro-netbanking-connect.html), themed */
.cs{background:var(--s-surf);border-radius:var(--card-r);padding:14px 16px 12px;flex:none}
.cs-r{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cs-r b{display:block;font-size:14px;font-weight:600}
.cs-r span{display:block;font-size:11.5px;color:var(--s-tx2);margin-top:3px;font-weight:500}

.co-sel{text-align:center;margin:2px 0 -4px;flex:none}
.co-sel b{display:block;font-size:14px;font-weight:600}
.co-sel span{display:block;font-size:12px;font-weight:500;color:var(--s-tx2);margin-top:1px}
.ops{display:flex;flex-direction:column;gap:10px}
.op-r{display:flex;align-items:center;width:100%;height:62px;padding:0 14px;gap:13px;text-align:left;background:var(--s-bg);color:var(--s-tx);border:1px solid var(--s-bd);border-radius:var(--card-r);box-shadow:0 2px 12px rgba(16,24,40,.05);transition:background .15s,border-color .15s;flex:none}

.op-r img.ic{width:40px;height:40px;border-radius:50%;flex:none;display:block}

.op-t{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.2}
.op-t small{display:block;font-size:11px;font-weight:500;color:var(--s-tx2);margin-top:3px}

/* overlays */
.scrim{position:absolute;inset:0;background:rgba(5,8,12,.48);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--s-bg);border-radius:22px 22px 0 0;padding:10px 20px 18px;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s}
.sheet.on{transform:none;visibility:visible}
.sheet .hdl{width:40px;height:4px;border-radius:2px;background:var(--s-bd);margin:0 auto 14px}
.sheet h4{margin:0 0 6px;font-size:17px}
.srow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;padding:12px 0;border-bottom:1px solid var(--s-bd);font-size:15px;font-weight:500;color:var(--s-tx);text-align:left}
.srow svg{margin-left:auto;width:16px;height:16px;color:var(--s-tx2)}
.dlg{position:absolute;left:24px;right:24px;top:50%;z-index:41;background:var(--s-bg);border-radius:20px;padding:22px 20px 12px;transform:translateY(-40%) scale(.96);opacity:0;pointer-events:none;transition:all .2s;display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.dlg.on{opacity:1;transform:translateY(-50%);pointer-events:auto}
.dlg h4{margin:0;font-size:18px}
.dlg p{margin:0 0 8px;color:var(--s-tx2);font-size:14px}
.handoff{position:absolute;inset:0;z-index:45;background:#09090b;color:#fafafa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;font-family:'Inter',sans-serif}
.handoff.on{opacity:1;pointer-events:auto}
.handoff .tg{font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#a1a1aa;border:1px dashed #3f3f46;border-radius:6px;padding:5px 8px}
.handoff .big{width:64px;height:64px;border-radius:18px;background:#fff;display:grid;place-items:center;overflow:hidden}
.handoff b{font-size:19px}
.handoff p{margin:0;color:#a1a1aa;font-size:14px;max-width:260px}
.handoff .amt{font-size:34px;font-weight:700;letter-spacing:-.02em}
.handoff .bar{width:180px;height:4px;border-radius:2px;background:#27272a;overflow:hidden}
.handoff .bar i{display:block;height:100%;width:0;background:#fafafa;transition:width linear}
.toast{position:absolute;left:16px;right:16px;bottom:16px;z-index:46;background:#18181b;color:#fafafa;border-radius:12px;padding:10px 14px;font:500 12px/1.45 var(--mono);opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .25s,transform .25s,visibility .25s}
.toast.on{opacity:1;visibility:visible;transform:none}

/* ── dev panel ── */
.tabs{flex:none;display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:7px 10px 8px;font-size:var(--fs-s);font-weight:600;color:var(--fg-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.tab .ct{font-family:var(--mono);font-weight:500;font-size:10px;margin-left:4px;background:var(--panel-2);border-radius:5px;padding:0 5px;color:var(--fg-2)}
.tpanel{flex:1;min-height:0;overflow:auto;padding:12px 14px 18px}
.tpanel[hidden]{display:none}
.lg{display:flex;flex-direction:column;gap:2px}
.le{display:grid;grid-template-columns:52px 64px minmax(0,1fr);gap:6px;align-items:baseline;padding:5px 6px;border-radius:7px;font-size:var(--fs-s);line-height:1.45}
.le.new{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--panel-2)}to{background:transparent}}
.le .t{font-family:var(--mono);font-size:10.5px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.le .k{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.04em;border-radius:5px;padding:0 5px;justify-self:start;border:1px solid currentColor;line-height:1.6}
.le .k.SCREEN{color:var(--t-scr)} .le .k.API{color:var(--t-api)} .le .k.POLL{color:var(--t-poll)} .le .k.CALLBACK{color:var(--accent-fg);background:var(--accent);border-color:var(--accent)} .le .k.TOKEN,.le .k.WARN{color:var(--t-tok)} .le .k.SDK{color:var(--fg-2)} .le .k.UPI{color:var(--fg-2);border-style:dashed}
.le .m{min-width:0;overflow-wrap:anywhere}
.le .m b{font-weight:600}
.le .m code{display:block;font-family:var(--mono);font-size:10.5px;color:var(--fg-2);margin-top:1px;white-space:pre-wrap;overflow-wrap:anywhere}
.le .m .rs{color:var(--ok);font-weight:500} .le .m .rf{color:var(--err);font-weight:500} .le .m .rp{color:var(--warn);font-weight:500}
.empty{color:var(--fg-3);font-size:var(--fs-b);padding:14px 4px;line-height:1.5}
.codehd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 6px}
.codehd b{font-size:var(--fs-t)}
.codehd small{color:var(--fg-3);font-size:var(--fs-s)}
pre.code{margin:0 0 14px;background:var(--code-bg);color:var(--code-fg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font:400 11.5px/1.55 var(--mono);overflow-x:auto;white-space:pre}
.jk{color:var(--j-key);font-weight:500} .js{color:var(--j-str)} .jn{color:var(--j-num)} .jl2{color:var(--j-lit)} .jc2{color:var(--fg-3)}

.badge{display:inline-flex;align-items:center;font-size:var(--fs-s);font-weight:600;border-radius:999px;padding:1px 9px}
.badge.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-bd)} .badge.bad{background:var(--err-soft);color:var(--err);border:1px solid var(--err-bd)} .badge.wn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-bd)} .badge.nt{background:var(--panel-2);color:var(--fg-2);border:1px solid var(--line)}
.spec h4{margin:0 0 2px;font-size:var(--fs-t)}
.spec .pur{color:var(--fg-2);margin:0 0 10px}
.spec table{width:100%;border-collapse:collapse;font-size:var(--fs-s);margin-bottom:12px}
.spec th{text-align:left;font-weight:600;color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em;font-size:10px;padding:4px 6px;border-bottom:1px solid var(--line)}
.spec td{vertical-align:top;padding:6px;border-bottom:1px solid var(--line);line-height:1.45}
.spec td:first-child{font-weight:600;white-space:nowrap;padding-right:10px}
.spec .lbl{font-size:10px;font-weight:600;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px}

.spec li{margin:2px 0}
.spec code{font-family:var(--mono);font-size:10.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.inv{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.inv div{display:flex;align-items:center;gap:8px;font-size:var(--fs-s);padding:4px 6px;border-radius:6px}
.inv div.cur{background:var(--panel-2);font-weight:600;box-shadow:inset 2px 0 0 var(--fg)}
.inv i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--fg-3);width:16px}

/* drawers */
.dscrim{position:fixed;inset:0;background:var(--scrim);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.dscrim.on{opacity:1;pointer-events:auto}

#demoLeft{display:flex;flex-direction:column;gap:18px}
.dv-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dv-h b{font-size:var(--fs-t)}
.dv-h small{color:var(--fg-3);font-size:var(--fs-s)}
.ed-wrap{display:flex;border:1px solid var(--line);border-radius:10px;background:var(--code-bg);height:clamp(260px,44vh,560px);overflow:hidden}
.ed-wrap:focus-within{border-color:var(--fg);box-shadow:0 0 0 3px var(--ring)}
.ed-gut{padding:10px 8px 10px 10px;text-align:right;color:var(--fg-3);font:11.5px/1.6 var(--mono);user-select:none;overflow:hidden;white-space:pre;border-right:1px solid var(--line);min-width:36px}
#reqEd{flex:1;min-width:0;border:0;background:transparent;resize:none;padding:10px 12px;font:11.5px/1.6 var(--mono);color:var(--code-fg);outline:none;white-space:pre;overflow:auto;tab-size:2}
#reqEd:focus-visible{box-shadow:none}
.ed-status{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:var(--fs-s);line-height:1.5;display:flex;flex-direction:column;gap:4px}
.ed-status.ok{background:var(--ok-soft);border-color:var(--ok-bd);color:var(--ok)}
.ed-status.bad{background:var(--err-soft);border-color:var(--err-bd);color:var(--err)}
.ed-status .w{color:var(--warn)}
.ed-status code{font-family:var(--mono);font-size:10.5px;font-weight:600}
.ed-act{display:flex;gap:6px;flex-wrap:wrap}
.ed-act .tbtn.pri{flex:1;justify-content:center}
.kbd{font:500 10px/1 var(--mono);border:1px solid currentColor;border-radius:4px;padding:2px 4px;opacity:.7}
.init{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.init summary{cursor:pointer;font-size:var(--fs-s);font-weight:600}
.init .grid{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin-top:8px;font-size:var(--fs-s)}
.init input{height:30px;border:1px solid var(--line);border-radius:7px;padding:0 8px;background:var(--panel);font:11.5px var(--mono);min-width:0;width:100%}
.mk{display:flex;flex-direction:column;gap:10px}
.mk-g{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:10px;padding:10px}
.mk-g h4{margin:0;font-size:var(--fs-s);font-weight:600;display:flex;align-items:center;gap:6px}
.mk-g h4 code{font:500 10px var(--mono);color:var(--fg-3)}
.mk-r{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center;font-size:var(--fs-s);color:var(--fg-2)}
.mk-r select,.mk-r input{height:30px;border:1px solid var(--line);border-radius:7px;padding:0 6px;background:var(--panel);font-size:var(--fs-s);min-width:0;width:100%}
/* network */
.nt-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:var(--fs-s);color:var(--fg-2)}
.nt-bar label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.nr{display:grid;grid-template-columns:42px minmax(0,1fr) auto 52px;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:7px 4px;font-size:var(--fs-s)}
.nr:hover{background:var(--panel-2)}
.nr.on{background:var(--panel-2)}
.nr .mt{font:600 10.5px var(--mono)}
.nr .pt{font:11px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nr .pt small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--fg-3)}
.nr .sc{font:600 10.5px var(--mono);border-radius:5px;padding:1px 6px;border:1px solid}
.sc.s2{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-bd)} .sc.s4,.sc.s5{color:var(--err);background:var(--err-soft);border-color:var(--err-bd)}
.nr .du{font:10.5px var(--mono);color:var(--fg-3);text-align:right}
.nd{padding:8px 4px 14px;border-bottom:1px solid var(--line)}
.nd .lbl{font-size:10px;font-weight:600;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px;display:flex;justify-content:space-between;align-items:center}
.nd pre.code{margin:0;max-height:260px;overflow:auto}
.nd .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:var(--fs-s)}
.nd .kv span{color:var(--fg-3)} .nd .kv b{font:500 11px var(--mono);overflow-wrap:anywhere}
.tbtn.xs{height:26px;padding:0 8px;font-size:11px}
/* callbacks */
.cb{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.cb summary{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;font-size:var(--fs-s);list-style:none}
.cb summary::-webkit-details-marker{display:none}
.cb summary .t{margin-left:auto;font:10.5px var(--mono);color:var(--fg-3)}
.cb pre.code{margin:0;border:0;border-top:1px solid var(--line);border-radius:0;max-height:420px;overflow:auto}
/* screens gallery */
.pvg{margin-bottom:12px}
.pvg h5{margin:0 0 6px;font-size:10px;font-weight:600;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em}
.pvg .l{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pvb{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px;text-align:left;font-size:var(--fs-s);font-weight:500;display:flex;align-items:center;gap:6px;min-width:0}
.pvb:hover{border-color:var(--fg)}
.pvb.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.pvb i{font-style:normal;width:7px;height:7px;border-radius:50%;flex:none;background:var(--fg-3)}
.pvb i.ok{background:var(--ok)} .pvb i.bad{background:var(--err)} .pvb i.wn{background:var(--warn)}
.pvb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* state */
.stt td code{font-size:10px}
.pill{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;border-radius:999px;padding:0 7px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg-2);white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-bd)} .pill.bad{color:var(--err);background:var(--err-soft);border-color:var(--err-bd)} .pill.wn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-bd)}
/* inspector */
.device.inspecting .vp,.device.inspecting .vp *{cursor:crosshair!important}
.insp-box{position:absolute;z-index:90;pointer-events:none;outline:2px solid #c026d3;background:rgba(192,38,211,.08);border-radius:3px}
.insp-box::after{content:attr(data-n);position:absolute;left:-2px;top:-20px;background:#c026d3;color:#fff;font:600 10px/1 var(--mono);padding:4px 5px;border-radius:3px 3px 3px 0;white-space:nowrap}
.insp-tip{position:fixed;z-index:200;width:290px;background:#09090b;color:#fafafa;border:1px solid #27272a;border-radius:10px;padding:10px 12px;font-size:11.5px;line-height:1.5;box-shadow:0 16px 40px rgba(0,0,0,.35);pointer-events:none}
.insp-tip b{display:block;font:600 12.5px var(--mono);margin-bottom:6px;color:#f0abfc}
.insp-tip .r{display:grid;grid-template-columns:70px 1fr;gap:2px 8px}
.insp-tip .r span{color:#a1a1aa}
.insp-tip .r em{font-style:normal;font-family:var(--mono);font-size:10.5px}
.insp-tip .sw2{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.insp-tip .k{margin-top:6px;padding-top:6px;border-top:1px solid #27272a;color:#d4d4d8;font-family:var(--mono);font-size:10.5px}
#btnInspect[aria-pressed="true"]{background:#c026d3;border-color:#c026d3;color:#fff}
.pvchip{display:inline-flex;align-items:center;gap:6px;background:#c026d3;color:#fff;font:600 11px/1 var(--sans);border-radius:999px;padding:4px 10px;margin-right:6px;vertical-align:1px}
body.devmode .tab{padding:7px 8px 8px}
@media (max-width:1320px){ body.devmode .main{grid-template-columns:clamp(300px,30vw,380px) minmax(0,1fr)} }
@media (max-width:980px){ body.devmode .main{grid-template-columns:minmax(0,1fr)} }

@media (max-width:1320px){
  .main{grid-template-columns:292px minmax(0,1fr)}
  .dev{position:fixed;right:0;top:0;bottom:0;width:min(440px,94vw);z-index:70;transform:translateX(102%);transition:transform .28s}
  .dev.open{transform:none;box-shadow:-20px 0 40px rgba(0,0,0,.18)!important}
  #btnDev{display:inline-flex}
}
@media (max-width:980px){
  .main{grid-template-columns:minmax(0,1fr)}
  .ctl{position:fixed;left:0;top:0;bottom:0;width:min(330px,90vw);z-index:70;transform:translateX(-102%);transition:transform .28s}
  .ctl.open{transform:none;box-shadow:20px 0 40px rgba(0,0,0,.18)!important}
  #btnCtl{display:inline-flex}
}
@media (max-width:720px){
  .brand .tag,.brand .sep,.brand b,#osSeg,#btnRestartTop .t{display:none}
  .top{gap:8px}
}
@media (max-width:600px){
  .top{height:48px;padding-inline:10px;gap:6px}
  #btnCtl,#btnDev,#btnRestartTop{font-size:0;gap:0;padding:0 9px}
  .modeseg button{padding:4px 8px}
  .modeseg button[data-v="dev"]{font-size:0;gap:0}
  .brand{flex:none}
  .brand svg.logo{width:80px;height:16px}
}
@media (max-height:700px){ .caption{display:none} }
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ══════════════════════════════════════════════════════════════
   FACE FORENSICS ADDITIONS
   Everything below is specific to this demo: the camera surface, the
   score meters, the image pair and the attack-variant renderings.
   ══════════════════════════════════════════════════════════════ */

/* §6.1 / §6.7 — the primary action is always visible and always under the
   thumb. The SDK body is the scroll region, so the action bar sticks to the
   bottom of it rather than scrolling off the end of a long screen. */
.s-act{position:sticky;bottom:0;z-index:5;background:var(--s-bg);margin-top:auto;
  padding-top:10px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
/* The bar sits on the bottom edge of the scroll region, so the region must not hold it
   up with its own bottom padding — that is what left the buttons floating high above
   the Powered-by line on short screens like Consent. */
.s-body:has(.s-act){padding-bottom:0;scroll-padding-bottom:84px}
/* Flex items default to flex-shrink:1, so on a long screen the cards were squeezed and
   clipped their own last rows instead of overflowing — the region then reported no scroll
   height at all, so there was nothing to scroll and content silently disappeared. */
.s-body > *{flex:none}
/* A fade instead of a hard edge: on a long screen (Result) content passes UNDER the bar,
   and a hard edge read as a card sliced in half. */
.s-body:has(.s-act) .s-act::before{
  content:'';position:absolute;left:0;right:0;bottom:100%;height:18px;pointer-events:none;
  background:linear-gradient(to top,var(--s-bg),transparent);
}
.s-body:has(.s-act) .s-act{box-shadow:none}
.s-act{position:sticky}
body.fb .s-body{padding-bottom:0}
/* Powered-by strip hugs the bar instead of adding another band of dead space. */
.s-foot{padding:2px 0 6px;font-size:10.5px}

/* A capture preview never grows past the room the screen has — the buttons
   under it matter more than another 80 px of photograph (§6.4). */

/* ── camera surface (inside the device) ── */
.cam-s{position:absolute;inset:0;display:flex;flex-direction:column;background:#0b0b0d;color:#fff;z-index:12}
.cam-top{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px}
.cam-top b{font-size:14.5px;font-weight:600}
.cam-x{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.cam-x svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.cam-tag{margin-left:auto;font:500 10px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.6);border:1px dashed rgba(255,255,255,.3);border-radius:6px;padding:4px 6px}
.cam-view{flex:1;min-height:0;position:relative;overflow:hidden;background:#17181c}
.cam-feed{position:absolute;inset:0}
.cam-feed svg{width:100%;height:100%;display:block}
/* the oval guide: a dark scrim with an oval hole, drawn with one radial mask */
.cam-mask{position:absolute;inset:0;background:rgba(8,9,12,.62);
  -webkit-mask:radial-gradient(49% 36% at 50% 44%,transparent 98%,#000 100%);
  mask:radial-gradient(49% 36% at 50% 44%,transparent 98%,#000 100%)}
.cam-oval{position:absolute;left:50%;top:44%;width:66%;height:52%;transform:translate(-50%,-50%);
  border-radius:50%;border:3px solid rgba(255,255,255,.55);transition:border-color .25s,box-shadow .25s}
.cam-oval.good{border-color:var(--s-ok,#16a34a);box-shadow:0 0 0 6px color-mix(in srgb,var(--s-ok,#16a34a) 18%,transparent)}
.cam-oval.bad{border-color:#f59e0b}
.cam-oval i{position:absolute;width:20px;height:20px;border:3px solid #fff;opacity:.9}
.cam-oval i.tl{left:-3px;top:28%;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.cam-oval i.tr{right:-3px;top:28%;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.cam-oval i.bl{left:-3px;bottom:12%;border-right:0;border-top:0;border-radius:0 0 0 6px}
.cam-oval i.br{right:-3px;bottom:12%;border-left:0;border-top:0;border-radius:0 0 6px 0}
.cam-hint{position:absolute;left:14px;right:14px;bottom:16px;text-align:center}
.cam-hint span{display:inline-block;background:rgba(10,11,14,.78);border-radius:999px;padding:7px 15px;font-size:13.5px;font-weight:600;line-height:1.3;backdrop-filter:blur(6px)}
.cam-hint span.ok{background:color-mix(in srgb,var(--s-ok,#16a34a) 88%,#000);color:#fff}
.cam-bar{flex:none;padding:14px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.cam-ring{width:68px;height:68px;border-radius:50%;border:3px solid rgba(255,255,255,.85);display:grid;place-items:center;background:transparent;padding:0}
.cam-ring i{display:block;width:54px;height:54px;border-radius:50%;background:#fff;transition:transform .12s}
.cam-ring:active i{transform:scale(.9)}
.cam-ring.dis{opacity:.45}
.cam-auto{font-size:11.5px;color:rgba(255,255,255,.62);text-align:center;line-height:1.45}
.cam-count{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font:700 72px/1 var(--sans);color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
.flash.go{animation:fl .42s ease-out}
@keyframes fl{0%{opacity:.92}100%{opacity:0}}
.cam-scan{position:absolute;left:0;right:0;height:34%;top:0;z-index:5;pointer-events:none;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--s-p,#fff) 26%,transparent),transparent);
  animation:scan 1.9s cubic-bezier(.45,0,.55,1) infinite}
@keyframes scan{0%{top:-34%}100%{top:100%}}

/* ── captures ──
   One photograph, several treatments. Each attack overlay is built from
   what that attack actually does to a frame, so a presenter can point at
   the artefact rather than read a label. */
.shot{position:relative;width:100%;height:100%;overflow:hidden;background:#15171b;display:block}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.shot .fx{position:absolute;inset:0;pointer-events:none}

/* printed photo — matte, warm, slightly off-square, with a fold crease */
.shot-print{background:#cfc9c0}
.shot-print img{filter:saturate(.68) contrast(.88) brightness(1.07);transform:rotate(-2.2deg) scale(1.1)}
.shot-print .fx{background:
  linear-gradient(180deg,rgba(0,0,0,.10),rgba(255,255,255,.16) 48%,rgba(0,0,0,.13)),
  repeating-linear-gradient(27deg,rgba(0,0,0,.045) 0 2px,transparent 2px 7px)}
.shot-print .fx::after{content:"";position:absolute;left:-12%;right:-12%;top:54%;height:3px;
  background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(0,0,0,.28));transform:rotate(-1.8deg)}

/* screen replay — second display, refresh banding and a glare band */
.shot-replay{background:#0b0d11}
.shot-replay img{filter:brightness(.86) saturate(1.14) contrast(1.08);transform:scale(.82);border-radius:9px}
.shot-replay .fx{background:
  repeating-linear-gradient(180deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px),
  linear-gradient(116deg,rgba(255,255,255,.32) 0 20%,transparent 44%)}
.shot-replay .fx::after{content:"";position:absolute;inset:8% 9%;border:3px solid #22262d;border-radius:12px;
  box-shadow:inset 0 0 0 2px #090a0d,0 0 22px rgba(0,0,0,.6)}

/* photograph of a photograph — its own white border gives it away */
.shot-photo{background:#ddd8d0}
.shot-photo img{inset:12% 15%;width:70%;height:76%;border:9px solid #fff;
  box-shadow:0 0 0 1px #c6c0b6,0 8px 20px rgba(0,0,0,.22);filter:saturate(.84) contrast(.94)}
.shot-photo .fx{background:
  repeating-linear-gradient(19deg,rgba(0,0,0,.05) 0 2px,transparent 2px 7px),
  linear-gradient(122deg,rgba(255,255,255,.26) 0 18%,transparent 40%)}

/* moulded mask — colour, depth and skin texture all go flat, and the shell
   catches light the way resin does rather than skin */
.shot-mask{background:#b9b4ae}
.shot-mask img{filter:saturate(.1) contrast(.62) brightness(1.16) blur(.5px) sepia(.22)}
.shot-mask .fx{background:
  radial-gradient(52% 40% at 36% 30%,rgba(255,255,255,.34),transparent 62%),
  radial-gradient(44% 34% at 68% 34%,rgba(255,255,255,.2),transparent 60%),
  radial-gradient(64% 50% at 50% 40%,rgba(0,0,0,.2),transparent 72%)}
.shot-mask .fx::before{content:"";position:absolute;left:15%;right:15%;top:9%;height:66%;
  border:2px solid rgba(255,255,255,.46);border-bottom:0;border-radius:50% 50% 0 0;
  box-shadow:0 0 10px rgba(255,255,255,.22)}
.shot-mask .fx::after{content:"";position:absolute;left:24%;right:24%;top:68%;height:10%;
  border-bottom:2px solid rgba(0,0,0,.26);border-radius:0 0 50% 50%}

/* nothing in frame — the camera caught the room */
.shot-none img{filter:blur(9px) brightness(1.06) saturate(.8);transform:scale(2.1) translate(30%,44%)}
.shot-none em{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
  font:600 12px/1.4 var(--sans);font-style:normal;color:rgba(255,255,255,.92);text-shadow:0 1px 6px rgba(0,0,0,.6)}

/* two faces — the second person leans into frame */
.shot-multi{background:#1b1d22}
.shot-multi img{width:62%;height:78%}
.shot-multi .m1{inset:auto auto 0 -4%;top:14%}
.shot-multi .m2{inset:auto -6% 0 auto;top:24%;height:68%;width:54%;filter:brightness(.94)}

/* the reference document, shown whole */
.shot-card{background:#eef1f5}
.shot-card img{object-fit:contain;padding:4%}

.ph{border-radius:12px;overflow:hidden;background:#e4e4e7;position:relative;flex:none}
.ph .cnr{position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(9,9,11,.12);pointer-events:none}
.ph.sq{aspect-ratio:1/1}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.pair figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.pair figcaption{font-size:11.5px;font-weight:600;color:var(--s-tx2);display:flex;align-items:center;gap:5px;min-width:0}
.pair figcaption em{font-style:normal;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pair .ph{aspect-ratio:3/4;max-height:138px;align-self:start;width:100%}
.pair.rev .ph{aspect-ratio:1/1}
.pair.one .ph{aspect-ratio:4/5;max-height:min(42vh,330px)}

/* ── score meters ── */
.mtr{display:flex;flex-direction:column;gap:6px;width:100%}
.mtr-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13px}
.mtr-h b{font-weight:600}
.mtr-h .v{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mtr-t{position:relative;height:8px;border-radius:999px;background:var(--s-surf,#f4f4f5);overflow:hidden}
.mtr-t i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--s-tx);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.mtr-t i.ok{background:var(--s-ok)} .mtr-t i.bad{background:var(--s-err)} .mtr-t i.wn{background:var(--s-warn)}
.mtr-t u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--s-tx);opacity:.55;border-radius:1px}
.mtr-f{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--s-tx2)}
.mtr-f .th{font-variant-numeric:tabular-nums}

/* ── attack / reason callouts ── */
.rsn{display:flex;gap:10px;align-items:flex-start;width:100%;border-radius:var(--card-r);padding:12px 14px;font-size:13.5px;line-height:1.5;border:1px solid}
.rsn svg{width:18px;height:18px;flex:none;margin-top:1px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rsn b{display:block;font-weight:600;margin-bottom:1px}
.rsn.bad{background:color-mix(in srgb,var(--s-err) 7%,var(--s-bg));border-color:color-mix(in srgb,var(--s-err) 28%,transparent);color:var(--s-tx)}
.rsn.wn{background:color-mix(in srgb,var(--s-warn) 9%,var(--s-bg));border-color:color-mix(in srgb,var(--s-warn) 30%,transparent);color:var(--s-tx)}
.rsn.ok{background:color-mix(in srgb,var(--s-ok) 7%,var(--s-bg));border-color:color-mix(in srgb,var(--s-ok) 26%,transparent);color:var(--s-tx)}
.rsn.bad svg{color:var(--s-err)} .rsn.wn svg{color:var(--s-warn)} .rsn.ok svg{color:var(--s-ok)}
.s-kv{display:flex;flex-direction:column;gap:7px;width:100%}
.s-kv>div{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:13px}
.s-kv span{color:var(--s-tx2)}
.s-kv b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.s-kv .mono{font-family:var(--mono);font-size:11.5px}
.s-pct{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.s-pct small{font-size:17px;font-weight:600;letter-spacing:0}
.doc-r{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--s-bg);color:var(--s-tx);border:1px solid var(--s-bd);border-radius:var(--card-r);padding:12px 14px;transition:border-color .15s,background .15s}
.doc-r:hover{background:var(--s-surf);border-color:var(--s-tx2)}
.doc-r[aria-pressed="true"]{border-color:var(--s-p);box-shadow:0 0 0 1px var(--s-p)}
.doc-r .th{width:46px;height:34px;border-radius:7px;overflow:hidden;flex:none;background:var(--s-surf)}
.doc-r .tt{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.25}
.doc-r .tt small{display:block;font-size:11.5px;font-weight:500;color:var(--s-tx2);margin-top:3px;overflow-wrap:anywhere}
.doc-r svg.chv{width:18px;height:18px;flex:none;color:var(--s-tx2);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.hoff p{margin:0;font-size:var(--fs-s);color:var(--fg-2);line-height:1.5}
.hoff .row{display:flex;gap:6px;flex-wrap:wrap}
.oq{margin:0;padding-left:16px;font-size:var(--fs-s);color:var(--warn);line-height:1.5}

/* ============================================================
   Decentro Farsight · Face Forensics — demo + frontend handoff
   Built to Decentro-Demo.MD v1.0 (13 Oct 2026).

   Source of truth — docs.decentro.tech, fetched 14 Oct 2026:
     Passive Image Liveness v3  POST /v3/kyc/farsight/liveness/passive
       headers  client_id · client_secret · module_secret
       body     reference_id · consent · purpose (20–50) · image (base64 jpg|jpeg|png)
       200      { decentroTxnId, status, responseCode, message,
                  data:{ status, live, livenessScore, needToReview }, responseKey }
       400      E00009 empty reference_id / consent false / invalid consent /
                       empty purpose / short purpose / long purpose / empty image
                E00019 duplicate reference_id · E00020 invalid file format
     Face Match v3              POST /v3/kyc/farsight/face-match
       headers  client_id · client_secret
       body     reference_id · consent · purpose · images[] (0 = source, rest = targets)
                · threshold (default 70, max 95)
       200      { decentroTxnId, status, message,
                  data:[{ status, message, match, sourceImage, targetImage }], responseKey }

   Both endpoints answer in camelCase (decentroTxnId), not the snake_case
   envelope the payments APIs use. That is reproduced here as published.
   ============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hex32 = seed => { let h = ''; let x = seed * 2654435761 % 4294967296; for (let i = 0; i < 32; i++){ x = (x * 1103515245 + 12345) % 4294967296; h += (x >>> 24 & 15).toString(16); } return h; };
const IST = o => new Intl.DateTimeFormat('en-IN', { timeZone:'Asia/Kolkata', ...o });
const stamp = d => IST({ month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit', second:'2-digit', hour12:true }).format(d).replace(/,( \d{4})/, '$1,');
const hhmm = d => IST({ hour:'2-digit', minute:'2-digit', hour12:false }).format(d);
const nowIST = () => new Date();

/* ---------- merchant themes (Section 7.15) ---------- */
const PRESETS = {

  midnight: { name:'Midnight (dark)',  merchant:'Nocturne Pay', initials:'NP', product:'Wallet KYC',
    primary:'#F59E0B', font:"'Inter',sans-serif", radius:16, btnStyle:'FILLED', btnCase:'SENTENCE', darkDefault:true }
};

/* ---------- journeys ---------- */
const JOURNEYS = {
  LIVE_MATCH: { chain:['Liveness','Face Match'], p:'P0',

  LIVE: { chain:['Liveness'], p:'P1',
    d:'Passive liveness alone — a re-authentication or a step-up check where no reference photo is needed.' },
  MATCH: { chain:['Face Match'], p:'P1',
    d:'Face Match alone — the merchant already holds a trusted live capture and only needs the two faces compared.' }
};
const JLABEL = { LIVE_MATCH:'Liveness → Face Match', LIVE:'Passive Liveness only', MATCH:'Face Match only' };

/* ---------- outcomes (every one reachable from the selector) ---------- */
/* mock: cam · live · score · attack · face · match · api · step */
const OUT = {
  /* ── success ── */
  verified:      { n:'Verified · live and matched', tone:'ok', j:['LIVE_MATCH'],

  live_ok:       { n:'Live · passive liveness passed', tone:'ok', j:['LIVE'],

  match_border:  { n:'Matched · borderline, just over threshold', tone:'wn', j:['LIVE_MATCH','MATCH'],

    m:{ live:'yes', score:88, match:72.1, flag:'borderline' } },

  /* ── liveness failures ── */
  not_live:      { n:'Not live · photo of a photo', tone:'bad', j:['LIVE_MATCH','LIVE'],

  /* ── face match failures ── */
  match_fail:    { n:'Not matched · different person', tone:'bad', j:['LIVE_MATCH','MATCH'],

  /* ── API errors ── */

  empty_image:   { n:'400 · empty image', tone:'bad', j:['LIVE_MATCH','LIVE','MATCH'],

  ? { label:'PAN', no:P.pan, img:IMG.pan, ratio:'1.57' }
  : { label:'Aadhaar', no:P.aadhaar, img:IMG.aadFront, ratio:'1.37' };

/* ---------- journey settings ---------- */
const CFG_DEF = { threshold:70, autoCapture:true, docSource:'on_file', docType:'aadhaar', showScore:true, reviewRoute:true,
  purpose:'Customer onboarding KYC verification' };
let cfg = { ...CFG_DEF };

/* ---------- state ---------- */
const st = {
  j:'LIVE_MATCH', out:'verified', mode:'demo', os:'android', speed:1,
  screen:'app', th:{ preset:'decentro', dark:false, primary:null, btnStyle:null, btnCase:null },
  net:[], cbs:[], logs:[], netN:0, netOpen:null, hidePolls:false, t0:Date.now(),
  steps:{}, refs:[], attempt:1, consentAt:null, result:null, preview:null,
  inspect:false, pin:null, mock:null, timers:[], camPhase:0, selfie:null, target:null,
  reqText:'', reqErr:[]
};
const M = () => st.mock || {};
const sp = ms => Math.max(60, Math.round(ms / st.speed));
function later(fn, ms){ const t = setTimeout(fn, sp(ms)); st.timers.push(t); return t; }
function clearTimers(){ st.timers.forEach(clearTimeout); st.timers = []; }

/* ---------- theme ---------- */
function preset(){ return PRESETS[st.th.preset]; }
function effTheme(){
  const pr = preset(), dark = st.th.dark, base = dark ? DARK : LIGHT;
  const primary = st.th.primary || (dark && pr.primary === '#09090B' ? '#FAFAFA' : pr.primary);
  const onp = contrast(primary, '#FFFFFF') >= contrast(primary, '#09090B') ? '#FFFFFF' : '#09090B';
  return { pr, dark, pal:{ ...base, p:primary, onp },
    btnStyle:st.th.btnStyle || pr.btnStyle, btnCase:st.th.btnCase || pr.btnCase, radius:pr.radius, font:pr.font };
}
const lum = h => { const c = h.replace('#',''); const v = [0,2,4].map(i => { let x = parseInt(c.substr(i,2),16)/255; return x <= .03928 ? x/12.92 : Math.pow((x+.055)/1.055, 2.4); }); return .2126*v[0] + .7152*v[1] + .0722*v[2]; };
const contrast = (a,b) => { const l1 = lum(a), l2 = lum(b); return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05); };
function theme(){
  const t = effTheme(), d = $('#device'), s = d.style, pal = t.pal;
  s.setProperty('--s-bg', pal.bg); s.setProperty('--s-tx', pal.tx); s.setProperty('--s-tx2', pal.tx2);
  s.setProperty('--s-surf', pal.surf); s.setProperty('--s-bd', pal.bd); s.setProperty('--s-in-bg', pal.inBg);
  s.setProperty('--s-ok', pal.ok); s.setProperty('--s-warn', pal.warn); s.setProperty('--s-err', pal.err);
  s.setProperty('--s-dis', pal.dis); s.setProperty('--s-dis-tx', pal.disTx);
  s.setProperty('--s-p', pal.p); s.setProperty('--s-onp', pal.onp); s.setProperty('--s-in-focus', pal.p);
  s.setProperty('--h-bg', pal.host); s.setProperty('--s-font', t.font);
  s.setProperty('--card-r', t.radius + 'px'); s.setProperty('--btn-r', Math.min(t.radius, 14) + 'px');
  s.setProperty('--in-r', Math.min(t.radius, 12) + 'px'); s.setProperty('--btn-h', '52px');
  s.setProperty('--s-ts', '21px'); s.setProperty('--s-bs', '14.5px'); s.setProperty('--s-cs', '12.5px');
  d.classList.toggle('btn-outlined', t.btnStyle === 'OUTLINED');
  d.classList.toggle('case-upper', t.btnCase === 'UPPERCASE');
  const c = contrast(pal.p, pal.onp), w = $('#cwarn');
  if (c < 4.5){ w.hidden = false; w.textContent = `Button text on ${pal.p} is ${c.toFixed(1)}:1 — under the 4.5:1 floor. The SDK keeps the colour and flips the label to ${pal.onp}; a real merchant should darken it.`; }
  else w.hidden = true;
  $('#primaryIn').value = pal.p;
  $('#darkSw').setAttribute('aria-checked', st.th.dark);
  segSet('#bsSeg', t.btnStyle); segSet('#bcSeg', t.btnCase);
  $$('#presets [data-p]').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === st.th.preset));
  render();
}
function segSet(sel, v){ $$(sel + ' button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v ?? b.dataset.os) === String(v))); }

/* ============================================================
   CAPTURES
   One photograph, several treatments. Each presentation attack
   is the same frame filtered and overlaid the way that attack
   actually looks to a camera — a print goes matte and creased,
   a replay picks up scanlines and screen glare, a photo-of-a-
   photo shows its own border, a mask flattens and loses depth.
   ============================================================ */
const SHOT = {
  live:   ['', 'Selfie in frame'],
  print:  ['shot-print',  'Printed photograph held to the camera'],
  replay: ['shot-replay', 'Face replayed from a second screen'],
  photo:  ['shot-photo',  'A photograph of a photograph'],
  mask:   ['shot-mask',   'Moulded mask worn to the camera'],
  none:   ['shot-none',   'No face in frame'],
  multi:  ['shot-multi',  'Two faces in frame'],
  doc:    ['shot-doc',    'Photograph on the identity record']
};
function shot(kind, opt = {}){
  const [cls, alt] = SHOT[kind] || SHOT.live;
  /* On a genuine non-match somebody ELSE is at the camera. The Aadhaar record never
     changes — it is the photo on file — so the live capture is what differs, and it differs
     from the capture screen onward, not only at the result. */
  const otherPerson = (st.steps.MATCH && st.steps.MATCH.status === 'NOT_MATCHED') || st.out === 'match_fail';
  const liveSrc = (otherPerson && IMG.selfieAlt) ? IMG.selfieAlt : IMG.selfie;
  const src = kind === 'doc' ? IMG.idphoto : liveSrc;
  if (kind === 'multi')
    return `<div class="shot shot-multi" role="img" aria-label="${esc(alt)}">
      <img src="${IMG.selfie}" alt="" class="m1"><img src="${IMG.selfie}" alt="" class="m2"><span class="fx"></span></div>`;
  if (kind === 'none')
    return `<div class="shot shot-none" role="img" aria-label="${esc(alt)}">
      <img src="${IMG.selfie}" alt=""><span class="fx"></span><em>no face in frame</em></div>`;
  return `<div class="shot ${cls}" role="img" aria-label="${esc(opt.alt || alt)}">
    <img src="${src}" alt=""><span class="fx"></span></div>`;
}
/* the reference document, shown as the card it actually is */
function card(opt = {}){
  const d = DOC();
  return `<div class="shot shot-card" role="img" aria-label="${esc(d.label)} card, specimen">
    <img src="${d.img}" alt=""><span class="fx"></span></div>`;
}
function ph(kind, cls = '', opt = {}){ return `<div class="ph ${cls}">${shot(kind, opt)}<span class="cnr"></span></div>`; }

/* ============================================================
   MOCK SERVER  (Decentro-Demo.MD §9.5)
   Every call the SDK would make goes through net() so the Network
   tab, the cURL export and the handoff JSON all read from one place.
   ============================================================ */
const HOSTS = { STAGING:'in.staging.decentro.tech', PRODUCTION:'in.decentro.tech' };
let ENV = 'STAGING';
const host = () => HOSTS[ENV];
const PATH = { LIVE:'/v3/kyc/farsight/liveness/passive', MATCH:'/v3/kyc/farsight/face-match' };
const B64 = '/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwcJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPDIzNP/bAEM…';

function refId(prod){ const n = st.refs.filter(r => r.product === prod).length + 1; const id = `${P.base}${prod}${n}`; st.refs.push({ product:prod, id, at:nowIST() }); return id; }
const envl = (txn, status, code, key, data, msg) => ({ decentroTxnId:txn, status, responseCode:code, message:msg, ...(data !== undefined ? { data } : {}), responseKey:key });

function net(o){
  const e = { id:++st.netN, at:(Date.now() - st.t0)/1000, kind:o.kind || 'API', step:o.step,
    method:o.method, host:o.host || host(), path:o.path, ref:o.ref || null,
    headers:o.headers, body:o.body || null, http:o.http, res:o.res, ms:o.ms, label:o.label, ill:!!o.ill };
  st.net.push(e);
  const cls = o.http >= 200 && o.http < 300 ? 'rs' : 'rf';
  log(e.kind, `<b>${esc(o.label)}</b> <span class="${cls}">${esc(o.txt)}</span>`, o.code ? `${o.method} ${o.path} · ${o.code}` : `${o.method} ${o.path}`);
  renderNet(); renderState();
  return e;
}
function curlOf(e){
  const h = Object.entries(e.headers).map(([k,v]) => `  -H '${k}: ${v}'`).join(' \\\n');
  return `curl --location '${'https://' + e.host + e.path}' \\\n  -X ${e.method} \\\n${h}${e.body ? ` \\\n  --data '${JSON.stringify(e.body, null, 2)}'` : ''}`;
}
const liveHeaders = () => ({ client_id:'decentro_fin_<client>', client_secret:'••••••••••••••••', module_secret:'••••••••••••••••', 'Content-Type':'application/json' });
const matchHeaders = () => ({ client_id:'decentro_fin_<client>', client_secret:'••••••••••••••••', 'Content-Type':'application/json' });

const ERRS = {
  consent_false:  { http:400, code:'E00009', key:'error_consent_false',          msg:'Consent is mandatory to proceed with this request.', sdk:'CONSENT_DECLINED' },
  purpose_short:  { http:400, code:'E00009', key:'error_short_purpose_length',   msg:'Purpose length should be a minimum of 20 characters.', sdk:'INVALID_REQUEST' },
  purpose_long:   { http:400, code:'E00009', key:'error_long_purpose_length',    msg:'Purpose length should be a maximum of 50 characters.', sdk:'INVALID_REQUEST' },
  empty_ref:      { http:400, code:'E00009', key:'error_empty_reference_id',     msg:'Reference id cannot be empty.', sdk:'INVALID_REQUEST' },
  dup_ref:        { http:400, code:'E00019', key:'error_duplicate_reference_id', msg:'Duplicate reference id.', sdk:'INVALID_REQUEST' },
  empty_image:    { http:400, code:'E00009', key:'error_empty_image',            msg:'Image cannot be empty.', sdk:'INVALID_REQUEST' },
  invalid_format: { http:400, code:'E00020', key:'error_invalid_file_format',    msg:'Invalid file format. Supported formats are jpg, jpeg and png.', sdk:'INVALID_REQUEST' },
  auth:           { http:401, code:'E00001', key:'error_invalid_credentials',    msg:'Invalid credentials, or the Farsight module is not enabled for this client_id.', sdk:'AUTH_FAILED', ill:true },
  credits:        { http:402, code:'E00005', key:'error_insufficient_credits',   msg:'Insufficient credits for the Farsight module.', sdk:'INSUFFICIENT_CREDITS', ill:true }
};
const UI_ERR = {
  consent_false:  { t:'We could not continue without consent', b:'Consent is a regulatory requirement for this check. Nothing was captured or sent.' },
  purpose_short:  { t:'This check is not configured correctly', b:'The integration sent a purpose shorter than the 20 characters the API requires. Nothing was captured.' },
  dup_ref:        { t:'This check has already been used', b:'A reference ID can be used once. Start a fresh check from the app.' },
  invalid_format: { t:'That image format is not supported', b:'Your phone handed over an HEIC file. Retake the selfie and we will convert it to JPEG first.' },
  empty_image:    { t:'The photo did not reach us', b:'The capture arrived empty. Retake the selfie — nothing was stored.' },
  auth:           { t:'Face check is unavailable', b:'The app could not authenticate with Decentro. Your details are safe; please try again later.' },
  credits:        { t:'Face check is unavailable', b:'This service is temporarily out of capacity. Please try again later or continue without it.' },
  timeout:        { t:'That took too long', b:'The network dropped while we were verifying. We will try once more.' }
};

/* ---------- the two API calls ---------- */
function callLiveness(cb){
  const m = M(), a = m.api;
  const bad = ERRS[a];
  const ref = a === 'dup_ref' ? st.refs.filter(r => r.product === 'LIVE')[0]?.id || refId('LIVE') : refId('LIVE');
  const body = { reference_id:a === 'empty_ref' ? '' : ref, consent:a === 'consent_false' ? false : true,
    purpose:a === 'purpose_short' ? 'KYC' : cfg.purpose, image:a === 'empty_image' ? '' : B64 };
  const ms = 240 + Math.round(Math.random() * 420);
  later(() => {
    if (bad){
      net({ step:'LIVE', method:'POST', path:PATH.LIVE, ref:body.reference_id, headers:liveHeaders(), body, http:bad.http, ill:bad.ill,
        res:envl(null, 'FAILURE', bad.code, bad.key, undefined, bad.msg), ms, label:'Passive Liveness', txt:`${bad.http} ${bad.code}`, code:bad.key });
      st.steps.LIVE = { status:'ERROR', ref:body.reference_id, err:a };
      return cb({ ok:false, err:a });
    }
    const txn = hex32(7 + st.netN);
    const live = m.live === 'yes' ? 'yes' : 'no';
    const score = m.score ?? (live === 'yes' ? 92 : 14);
    const review = m.review ? 'yes' : 'no';
    const noFace = m.face === 'none_source', multi = m.face === 'multi';
    if (noFace || multi){
      const key = multi ? 'error_multiple_faces_detected' : 'error_no_face_detected';
      const msg = multi ? 'More than one face detected in the image.' : 'No face detected in the image.';
      net({ step:'LIVE', method:'POST', path:PATH.LIVE, ref:ref, headers:liveHeaders(), body, http:400, ill:true,
        res:envl(txn, 'FAILURE', 'E00009', key, undefined, msg), ms, label:'Passive Liveness', txt:`400 ${key}`, code:key });
      st.steps.LIVE = { status:'FAILED', ref, txn, reason:multi ? 'multi' : 'no_face' };
      return cb({ ok:false, face:multi ? 'multi' : 'no_face' });
    }
    const data = { status:'SUCCESS', live, livenessScore:String(score), needToReview:review };
    net({ step:'LIVE', method:'POST', path:PATH.LIVE, ref, headers:liveHeaders(), body, http:200,
      res:envl(txn, 'SUCCESS', 'S00000', 'success_liveness_check', data, 'Liveness check completed successfully.'),
      ms, label:'Passive Liveness', txt:`200 live ${live} · score ${score}${review === 'yes' ? ' · review' : ''}`, code:'success_liveness_check' });
    st.steps.LIVE = { status:live === 'yes' ? (review === 'yes' ? 'REVIEW' : 'LIVE') : 'NOT_LIVE', ref, txn, score, live, review };
    cb({ ok:true, live, score, review });
  }, ms);
}
function callFaceMatch(cb){
  const m = M(), a = m.api, bad = ERRS[a];
  const ref = a === 'dup_ref' ? st.refs.filter(r => r.product === 'MATCH')[0]?.id || refId('MATCH') : refId('MATCH');
  const body = { reference_id:ref, consent:a === 'consent_false' ? false : true,
    purpose:a === 'purpose_short' ? 'KYC' : cfg.purpose, images:[B64, B64], threshold:cfg.threshold };
  const ms = 280 + Math.round(Math.random() * 520);
  later(() => {
    if (bad){
      net({ step:'MATCH', method:'POST', path:PATH.MATCH, ref, headers:matchHeaders(), body, http:bad.http, ill:bad.ill,
        res:envl(null, 'FAILURE', bad.code, bad.key, undefined, bad.msg), ms, label:'Face Match', txt:`${bad.http} ${bad.code}`, code:bad.key });
      st.steps.MATCH = { status:'ERROR', ref, err:a };
      return cb({ ok:false, err:a });
    }
    const txn = hex32(23 + st.netN);
    const noSrc = m.face === 'none_source', noTgt = m.face === 'none_target', multi = m.face === 'multi';
    if (noSrc || noTgt || multi){
      const which = noSrc ? 'source' : noTgt ? 'target' : 'source';
      const msg = multi ? 'More than one face detected in the source image.' : `No face detected in the ${which} image.`;
      const key = multi ? 'error_multiple_faces_detected' : 'error_no_face_detected';
      net({ step:'MATCH', method:'POST', path:PATH.MATCH, ref, headers:matchHeaders(), body, http:400, ill:true,
        res:envl(txn, 'FAILURE', 'E00009', key, undefined, msg), ms, label:'Face Match', txt:`400 ${key}`, code:key });
      st.steps.MATCH = { status:'FAILED', ref, txn, reason:multi ? 'multi' : noTgt ? 'no_face_tgt' : 'no_face_src' };
      return cb({ ok:false, face:multi ? 'multi' : noTgt ? 'no_face_tgt' : 'no_face_src' });
    }
    const pct = m.match ?? 96.4, pass = pct >= cfg.threshold;
    const data = [{ status:pass ? 'SUCCESS' : 'FAILURE', message:pass ? 'Faces matched successfully.' : 'Faces did not match.',
      match:pct.toFixed(1) + '%', sourceImage:0, targetImage:1 }];
    net({ step:'MATCH', method:'POST', path:PATH.MATCH, ref, headers:matchHeaders(), body, http:200,
      res:envl(txn, 'SUCCESS', 'S00000', 'success_face_scan', data, 'Face scan completed successfully.'),
      ms, label:'Face Match', txt:`200 match ${pct.toFixed(1)}% · threshold ${cfg.threshold}`, code:'success_face_scan' });
    st.steps.MATCH = { status:pass ? 'MATCHED' : 'NOT_MATCHED', ref, txn, match:pct, threshold:cfg.threshold };
    cb({ ok:true, pass, pct });
  }, ms);
}

   LOG & CALLBACKS

function log(kind, html, code){
  st.logs.push({ kind, html, code, at:(Date.now() - st.t0)/1000 });
  renderLog();
}
function emit(name, payload){
  st.cbs.push({ name, payload, at:nowIST() });
  log('CALLBACK', `<b>${esc(name)}</b> fired`, JSON.stringify(payload).slice(0, 110));
  renderCbs(); renderTabs();
}
