<!DOCTYPE html>
<meta charset="utf-8">

<title>Net Banking 2.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  Decentro · Net Banking 2.0 (NBBL Banking Connect) — UI demo
  ─────────────────────────────────────────────────────────────────────────────
  Desktop side = the production hosted checkout, screen for screen (payment
  options, Net Banking dropdown, Net Banking QR, Select a Bank, Simulating
  loader, and every status screen). Illustrations, icons, bank logos and the
  QR are cropped from the live checkout and embedded as data URIs.

  Journeys (tabs in the top bar; Screens menu jumps anywhere):
    qr   desktop checkout → QR → switch to the payer's phone: open bank app →
         log in → Scan & Pay → bank checkout → swipe → MPIN → receipt; the
         laptop beside it goes QR → Simulating → Payment Successful
    app  checkout → Pay using Bank App → Android "Open with" → bank checkout →
         swipe → MPIN → receipt → back on the checkout: Payment Successful
    web  checkout → Redirect → Select a Bank → bank login → OTP → confirm →
         Payment Successful (today's route, for contrast)
    out  other outcomes: Pending, Failed, Refund Initiated, On-Hold,
         Link Expired, Invalid Link

  Everything inside the phone after the OS sheet is BANK-OWNED UI, themed per
  bank by --bc/--bd. @dev Endpoint names in the </> panel are ILLUSTRATIVE; the
  nb:// link shape is taken from a live Banking Connect test.
-->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  color-scheme:light;
  --background:#fafafa; --foreground:#09090b; --card:#ffffff;
  --primary:#09090b; --primary-foreground:#fafafa;
  --secondary:#f4f4f5; --muted:#f4f4f5; --muted-foreground:#71717a; --subtle:#52525b;
  --border:#e4e4e7; --input:#e4e4e7; --ring:#09090b; --radius:10px;
  --success:#16a34a; --success-bg:#f0fdf4; --success-bd:#bbf7d0; --success-tx:#166534;
  --warn:#d97706; --warn-bg:#fffbeb; --warn-bd:#fde68a; --warn-tx:#92400e;
  --info:#2563eb; --info-bg:#eff6ff; --info-bd:#bfdbfe; --info-tx:#1e40af;
  --danger-bg:#fef2f2; --danger-bd:#fecaca; --danger-tx:#991b1b;
  --brand:#4f46e5; --brand-2:#7c3aed;
  --shadow-sm:0 1px 2px rgba(9,9,11,.05);
  --shadow-md:0 4px 12px rgba(9,9,11,.06),0 2px 4px rgba(9,9,11,.04);
  --shadow-lg:0 12px 32px rgba(9,9,11,.10);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%;overflow:hidden}
body{background:var(--background);color:var(--foreground);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;text-align:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:none;box-shadow:0 0 0 2px var(--background),0 0 0 4px var(--ring);border-radius:8px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

.page{flex:1;min-height:0;display:flex;justify-content:center;padding:22px 32px 24px}
.grid2{width:100%;max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:28px;align-items:start}
/* ═════════ COMPONENTS ═════════ */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.card-h{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-h.tint{background:var(--secondary)}
.card-t{font-size:14px;font-weight:700;letter-spacing:-.1px;display:flex;align-items:center;gap:9px}
.card-t svg{color:var(--muted-foreground)}
.card-d{font-size:12px;color:var(--muted-foreground);margin-top:2px;line-height:1.5}
.card-b{padding:18px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:var(--radius);font-size:14px;font-weight:600;border:1px solid transparent;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{background:#27272a}
.btn-primary:active{transform:scale(.985)}
.btn-outline{background:var(--card);border-color:var(--border);color:var(--foreground)}
.btn-outline:hover{background:var(--secondary)}
.btn-outline:disabled{opacity:.45;cursor:not-allowed}
.btn-lg{height:52px;font-size:15px}
.btn-block{width:100%}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;border:1px solid transparent;white-space:nowrap;line-height:1.6;letter-spacing:.1px}
.b-success{background:var(--success-bg);color:var(--success-tx);border-color:var(--success-bd)}
.b-info{background:var(--info-bg);color:var(--info-tx);border-color:var(--info-bd)}
.b-warn{background:var(--warn-bg);color:var(--warn-tx);border-color:var(--warn-bd)}
.b-muted{background:var(--secondary);color:var(--subtle);border-color:var(--border)}
.b-outline{color:var(--muted-foreground);border-color:var(--border)}
.alert{border-radius:var(--radius);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border:1px solid;font-size:12.5px;line-height:1.6}
.alert svg{margin-top:2px}
.alert strong.t{display:block;font-weight:700;margin-bottom:1px}
.a-info{background:var(--info-bg);border-color:var(--info-bd);color:var(--info-tx)}
.a-warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn-tx)}
.a-danger{background:var(--danger-bg);border-color:var(--danger-bd);color:var(--danger-tx)}
.a-muted{background:var(--card);border-color:var(--border);color:var(--subtle)}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;font-size:13px}
.row + .row{border-top:1px solid var(--border)}
.row span{color:var(--muted-foreground)}.row b{font-weight:600;text-align:right}
.total{background:var(--primary);color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.total span{font-size:12.5px;color:#a1a1aa;font-weight:500}.total b{font-size:22px;font-weight:800;letter-spacing:-.5px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted-foreground)}
.trust{display:flex;justify-content:center;gap:18px;font-size:11.5px;color:var(--muted-foreground);font-weight:500}
.trust span{display:inline-flex;align-items:center;gap:6px}.trust svg{width:13px;height:13px}
.tile{display:inline-grid;place-items:center;border-radius:9px;background:var(--bc);color:#fff;font-weight:800;letter-spacing:-.2px;flex:none;font-family:'Inter',sans-serif}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.chip-t{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--warn-tx);background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:100px;padding:3px 10px}
.chip-t svg{width:13px;height:13px}
.demo-tag{font-size:10.5px;font-weight:600;color:var(--muted-foreground);border:1px solid var(--border);border-radius:100px;padding:1px 8px;background:var(--card)}

/* ═════════ STAGE (phone) ═════════ */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,320px) auto minmax(280px,340px);justify-content:center;align-items:center;gap:36px;padding:14px 32px 10px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0;align-self:center}
.tl{list-style:none;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:26px 1fr;column-gap:12px;position:relative;padding-bottom:16px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:12px;top:28px;bottom:2px;width:2px;background:var(--border);border-radius:2px}
.tl li:last-child::before{display:none}
.tl li.done::before{background:var(--success)}
.tl .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;border:1.5px solid var(--border);background:var(--card);color:var(--muted-foreground)}
.tl li.done .dot{background:var(--success);border-color:var(--success);color:#fff}
.tl li.cur .dot{background:var(--primary);border-color:var(--primary);color:#fff}
.tl .dot svg{width:12px;height:12px;stroke-width:3.2}
.tl .tt{font-size:13.5px;font-weight:600;color:var(--muted-foreground);padding-top:3px}
.tl li.done .tt,.tl li.cur .tt{color:var(--foreground)}
.tl .dd{grid-column:2;font-size:12.5px;color:var(--subtle);line-height:1.6;margin-top:4px;display:none}
.tl li.cur .dd{display:block}
.tl .own{display:inline-block;margin-left:6px;vertical-align:1px}
.live-top{display:flex;align-items:center;gap:12px}
.live-top .brand-mark{width:34px;height:34px}
.live-top b{display:block;font-size:13.5px}.live-top div span{font-size:12px;color:var(--muted-foreground)}
.live-top .amt{margin-left:auto;font-size:16px;font-weight:800;letter-spacing:-.3px}
.stpill{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;font-size:12.5px;font-weight:600;margin-top:14px;border:1px solid}
.stpill.wait{background:var(--secondary);border-color:var(--border);color:var(--subtle)}
.stpill.act{background:var(--info-bg);border-color:var(--info-bd);color:var(--info-tx)}
.stpill.ok{background:var(--success-bg);border-color:var(--success-bd);color:var(--success-tx)}
.stpill svg{width:15px;height:15px}
.miniqr{display:flex;gap:12px;align-items:center;margin-top:12px;font-size:12px;color:var(--muted-foreground)}
.miniqr svg{width:64px;height:64px;border:1px solid var(--border);border-radius:8px;padding:4px;background:#fff}
.ev{list-style:none;display:flex;flex-direction:column;gap:0}
.ev li{display:grid;grid-template-columns:62px 1fr;gap:10px;font-size:12px;padding:6px 0;animation:fade .3s ease}
.ev time{font-family:var(--mono);font-size:11px;color:var(--muted-foreground);padding-top:1px}
.ev .x{color:var(--foreground);font-weight:500;line-height:1.45}
.ev .x .badge{margin-left:4px;vertical-align:1px}
.ev li.pend .x{color:var(--muted-foreground);display:flex;align-items:center;gap:7px}
.ev li.pend .spin{width:11px;height:11px}
.stage-foot{flex:none;display:flex;align-items:center;gap:14px;padding:12px 32px 16px;justify-content:center}
.stage-foot .cap{flex:1;max-width:560px;min-width:0}
.stage-foot .cap b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-foot .cap span{font-size:12px;color:var(--muted-foreground)}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{height:4px;flex:1;border-radius:4px;background:var(--border);transition:background .3s}
.dots i.on{background:var(--foreground)}

.phone{width:384px;height:792px;border-radius:58px;padding:12px;background:#111113;box-shadow:0 0 0 1.5px #3f3f46 inset,0 0 0 1px #d4d4d8,0 30px 70px rgba(9,9,11,.22),0 8px 20px rgba(9,9,11,.10)}
.scr{width:360px;height:768px;border-radius:46px;overflow:hidden;position:relative;background:#fff}
.scr > .ps{position:absolute;inset:0;display:flex;flex-direction:column;animation:psin .28s ease}
@keyframes psin{from{opacity:.3;transform:translateX(12px)}to{opacity:1;transform:none}}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:20px;background:#000;z-index:50}
.hbar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:5px;background:rgba(9,9,11,.8);z-index:50}
.hbar.lt{background:rgba(255,255,255,.85)}
.sb{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;font-size:14px;font-weight:600;color:#09090b;align-self:stretch;letter-spacing:-.2px}
.sb.lt{color:#fff}
.sb .ic{display:flex;gap:6px;align-items:center}.sb .ic svg{height:12px;fill:currentColor}
.hint{animation:hint 1.8s ease-out infinite}
@keyframes hint{0%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}70%{box-shadow:0 0 0 10px rgba(37,99,235,0)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}
@media (prefers-reduced-motion:reduce){.hint,.dev-btn.attract::after{animation:none}.scr>.ps,.screen,.sheet{animation:none!important}.scanline{animation:none!important}}
/* phone: mobile checkout (Decentro, behind the OS sheet) */
.mco{background:var(--background)}
.mco-h{padding:6px 18px 12px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border);background:#fff}
.mco-h .brand-mark{width:32px;height:32px;border-radius:9px}
.mco-h b{font-size:14px;display:block}.mco-h span{font-size:11px;color:var(--muted-foreground)}
.mco-b{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.mco .total{border-radius:var(--radius);padding:13px 16px}.mco .total b{font-size:19px}
.mco .rt{padding:11px 12px}.mco .rt .ri{width:34px;height:34px}.mco .rt .rtd{font-size:11px}
.mco .btn{height:48px}

/* phone: OS sheet */
.sheet-wrap{position:absolute;inset:0;background:rgba(9,9,11,.46);display:flex;align-items:flex-end;z-index:30}
.sheet{width:100%;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px 34px;animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(50%);opacity:.4}to{transform:none;opacity:1}}
.grab{width:36px;height:4px;border-radius:4px;background:#d4d4d8;margin:0 auto 14px}
.os-t{font-size:17px;font-weight:600;letter-spacing:-.2px}
.os-s{font-size:12px;color:var(--muted-foreground);margin-top:2px}
.os-g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:18px}
.os-a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:16px;font-size:11.5px;font-weight:500;text-align:center;line-height:1.3}
.os-a:hover{background:var(--secondary)}
.os-a .tile{width:54px;height:54px;border-radius:16px;font-size:12px}
.os-b{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.os-b span{text-align:center;font-size:13.5px;font-weight:600;color:#1d4ed8;padding:10px;border-radius:100px}

/* phone: bank app (themed by --bc/--bd) */
.ba{background:#f4f4f6;color:#09090b}
.ba-h{background:linear-gradient(150deg,var(--bc),var(--bd));color:#fff;flex:none}
.ba-nav{display:flex;align-items:center;gap:11px;padding:2px 18px 16px}
.ba-nav .bk-back{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.ba-nav .bk-back svg{width:16px;height:16px;stroke:#fff}
.ba-nav b{font-size:15.5px;font-weight:700;letter-spacing:-.2px;display:block}
.ba-nav span{font-size:11px;opacity:.82}
.ba-nav .wm{margin-left:auto;font-size:13px;font-weight:800;letter-spacing:-.3px;background:#fff;color:var(--bc);padding:5px 9px;border-radius:8px}
.ba-b{flex:1;min-height:0;padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px}
.bc{background:#fff;border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(9,9,11,.05)}
.payee{display:flex;align-items:center;gap:12px}
.payee .av{width:42px;height:42px;border-radius:12px;background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;flex:none}
.payee .av svg{width:20px;height:20px}
.payee b{font-size:14.5px;display:flex;align-items:center;gap:6px}
.payee b svg{width:15px;height:15px;color:#16a34a;stroke-width:2.2}
.payee div span{font-size:11px;color:var(--muted-foreground);letter-spacing:.2px}
.big-amt{font-size:34px;font-weight:800;letter-spacing:-1.2px;margin:14px 0 2px;font-variant-numeric:tabular-nums}
.big-l{font-size:11.5px;color:var(--muted-foreground);font-weight:500}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:8px 0}
.kv + .kv{border-top:1px solid #f0f0f2}
.kv span{color:var(--muted-foreground)}.kv b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.lbl-s{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:10px}
.acct{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:1.5px solid #e4e4e7;border-radius:14px;background:#fff}
.acct + .acct{margin-top:8px}
.acct.on{border-color:var(--bc);background:color-mix(in srgb,var(--bc) 5%,#fff)}
.acct .rd{width:18px;height:18px;border-radius:50%;border:2px solid #d4d4d8;display:grid;place-items:center;flex:none}
.acct.on .rd{border-color:var(--bc)}.acct.on .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--bc)}
.acct .at{flex:1;font-size:13px;font-weight:600}
.acct .at small{display:block;font-size:11px;color:var(--muted-foreground);font-weight:500}
.acct .bl{font-size:12px;font-weight:700;color:#09090b;font-variant-numeric:tabular-nums}
.acct .bl.v{color:var(--bc);font-weight:600}
.secure-n{display:flex;align-items:center;gap:9px;font-size:11.5px;color:#166534;padding:10px 12px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;line-height:1.45}
.secure-n svg{width:16px;height:16px;stroke:#16a34a;flex:none}
.ba-f{flex:none;padding:10px 16px 30px;background:#fff;border-top:1px solid #ececef}
.swipe{height:56px;border-radius:28px;background:var(--bc);position:relative;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:700;user-select:none;overflow:hidden;touch-action:none;letter-spacing:-.1px}
.swipe .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18);width:0}
.swipe .sl{position:relative;padding-left:34px}
.knob{position:absolute;left:5px;top:5px;width:46px;height:46px;border-radius:50%;background:#fff;color:var(--bc);display:grid;place-items:center;cursor:grab;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.knob svg{width:20px;height:20px;stroke-width:2.4}
.swipe.anim .knob,.swipe.anim .fill{transition:all .55s cubic-bezier(.4,0,.2,1)}
.nbbl-f{display:flex;align-items:center;justify-content:center;gap:7px;font-size:9.5px;font-weight:700;letter-spacing:.6px;color:#a1a1aa;margin-top:9px}
.splash{background:linear-gradient(160deg,var(--bc),var(--bd));color:#fff;align-items:center;justify-content:center;text-align:center}
.splash .wmx{font-size:34px;font-weight:800;letter-spacing:-1px}
.splash .an{font-size:13px;opacity:.85;margin-top:4px}
.splash .spin{width:22px;height:22px;color:#fff;margin-top:36px}
.splash .sec{position:absolute;bottom:44px;font-size:11px;opacity:.75;display:flex;align-items:center;gap:6px}
.mp-h{display:flex;justify-content:space-between;align-items:center}
.mp-h b{font-size:17px;letter-spacing:-.2px}.mp-h span{font-size:20px;color:#a1a1aa}
.mp-s{font-size:12.5px;color:var(--muted-foreground);margin-top:3px}
.pins{display:flex;gap:18px;justify-content:center;margin:24px 0 8px}
.pins i{width:16px;height:16px;border-radius:50%;border:2px solid #d4d4d8;transition:.12s}
.pins i.f{background:var(--bc);border-color:var(--bc)}
.mp-st{height:18px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted-foreground)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.key{height:50px;border-radius:14px;background:#f4f4f5;font-size:21px;font-weight:500;display:grid;place-items:center;transition:background .1s}
.key:hover{background:#e4e4e7}.key.pr{background:#d4d4d8}
.key svg{width:22px;height:22px;stroke:#3f3f46}
.proc{align-items:center;justify-content:center;text-align:center;gap:14px;background:#fff}
.proc .ring{width:64px;height:64px;border-radius:50%;border:4px solid color-mix(in srgb,var(--bc) 16%,#fff);border-top-color:var(--bc);animation:sp .9s linear infinite}
.proc b{font-size:17px;letter-spacing:-.2px}.proc span{font-size:12.5px;color:var(--muted-foreground);max-width:230px}
.rc-h{padding:6px 18px 74px;text-align:center}
.rc-ok{width:60px;height:60px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:4px auto 0;box-shadow:0 0 0 8px rgba(255,255,255,.18)}
.rc-ok svg{width:30px;height:30px;stroke:#16a34a;stroke-width:3}
.rc-h b{display:block;font-size:17px;margin-top:14px;letter-spacing:-.2px}
.rc-c{margin:-60px 16px 0;position:relative}
.rc-c .big-amt{text-align:center;margin:0}
.rc-c .to{text-align:center;font-size:12px;color:var(--muted-foreground);margin:2px 0 10px}
.rc-c .to b{color:#09090b}
.rc-act{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rc-act button{height:48px;border-radius:14px;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
.rc-act .o{background:#fff;border:1.5px solid #e4e4e7;color:#09090b}
.rc-act .p{background:var(--bc);color:#fff}
.return{display:flex;align-items:center;gap:11px;background:#fff;border-radius:14px;padding:12px 14px;font-size:12px;color:var(--subtle)}
.return .bar{flex:1;height:4px;border-radius:4px;background:#e4e4e7;overflow:hidden}
.return .bar i{display:block;height:100%;width:0;background:var(--bc)}
/* phone: home, unlock, dashboard, scanner */
.home{background:radial-gradient(120% 70% at 20% 0%,#3f3f46 0%,#18181b 55%,#09090b 100%);color:#fff}
.clock{text-align:center;margin-top:34px}
.clock b{display:block;font-size:64px;font-weight:300;letter-spacing:-2px;line-height:1}
.clock span{font-size:14px;opacity:.75}
.widget{margin:28px 18px 0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-size:12px;color:rgba(255,255,255,.8);backdrop-filter:blur(10px)}
.widget b{display:block;color:#fff;font-size:13px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px;padding:0 20px;margin-top:auto;margin-bottom:22px}
.app-i{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:#fff;text-align:center;line-height:1.2;border-radius:18px}
.app-i .ai{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.app-i .ai svg{width:26px;height:26px;stroke:#fff;stroke-width:1.7}
.app-i .tile{width:58px;height:58px;border-radius:17px;font-size:12.5px}
.app-i.hint{animation:hintw 1.8s ease-out infinite}
@keyframes hintw{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}70%{box-shadow:0 0 0 12px rgba(255,255,255,0)}100%{box-shadow:none}}
.dock{margin:0 14px 34px;background:rgba(255,255,255,.12);border-radius:30px;padding:12px 14px;display:flex;justify-content:space-around}
.unlock{background:linear-gradient(165deg,var(--bc),var(--bd));color:#fff;align-items:center;text-align:center}
.unlock .wmx{font-size:28px;font-weight:800;letter-spacing:-.8px;margin-top:84px}
.unlock h4{font-size:19px;font-weight:600;margin-top:34px;letter-spacing:-.3px}
.unlock p{font-size:12.5px;opacity:.8;margin-top:4px}
.fp{margin-top:auto;width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.3)}
.fp svg{width:42px;height:42px;stroke:#fff;stroke-width:1.6}
.fp.ok{background:#fff}.fp.ok svg{stroke:#16a34a;stroke-width:3}
.unlock .alt{font-size:12.5px;font-weight:600;margin:16px 0 56px;opacity:.9}
.dash .ba-h{padding-bottom:62px}
.hello{display:flex;align-items:center;gap:11px;padding:2px 18px 0}
.hello .av{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:13px;font-weight:700}
.hello b{display:block;font-size:15px;letter-spacing:-.2px}.hello div span{font-size:11.5px;opacity:.82}
.hello .wm{margin-left:auto;font-size:13px;font-weight:800;background:#fff;color:var(--bc);padding:5px 9px;border-radius:8px;letter-spacing:-.3px}
.balc{margin:-50px 16px 0;position:relative}
.balc .bl{font-size:11.5px;color:var(--muted-foreground)}.balc .bv{font-size:20px;font-weight:800;margin-top:3px;letter-spacing:1px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.qa-i{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 12px;background:#fff;border-radius:16px;font-size:11.5px;font-weight:600;text-align:center;box-shadow:0 1px 2px rgba(9,9,11,.05)}
.qa-i .q{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--bc) 9%,#fff);display:grid;place-items:center;color:var(--bc)}
.qa-i .q svg{width:20px;height:20px}
.qa-i.pri{background:var(--bc);color:#fff}.qa-i.pri .q{background:rgba(255,255,255,.18);color:#fff}
.promo{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:13px 14px;font-size:11.5px;color:var(--subtle);line-height:1.5;box-shadow:0 1px 2px rgba(9,9,11,.05)}
.promo b{display:block;color:#09090b;font-size:12.5px}
.promo .tile{width:38px;height:38px;font-size:9px}
.scan{background:#050507;color:#fff}
.scan-t{display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:15px;font-weight:600}
.vf{position:relative;width:260px;height:260px;margin:44px auto 0;border-radius:22px;overflow:hidden;background:#27272a}
.vf .cam{position:absolute;inset:-34px;background:#e4e4e7;transform:rotate(-4deg);display:grid;place-items:center;filter:blur(.3px) brightness(.94)}
.vf .cam svg{width:186px;height:186px}
.corner{position:absolute;width:36px;height:36px;border:4px solid #fff;z-index:2}
.corner.a{left:12px;top:12px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.corner.b{right:12px;top:12px;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.corner.c{left:12px;bottom:12px;border-right:0;border-top:0;border-radius:0 0 0 12px}
.corner.d{right:12px;bottom:12px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.scanline{position:absolute;left:16px;right:16px;height:2px;background:var(--bc);box-shadow:0 0 14px 2px var(--bc);top:16px;z-index:2;animation:sl 1.3s ease-in-out infinite alternate}
@keyframes sl{to{top:240px}}
.vf.got .scanline{display:none}
.vf.got::after{content:"";position:absolute;inset:0;border:3px solid #22c55e;border-radius:22px;z-index:3}
.scan-h{text-align:center;font-size:13px;opacity:.78;margin-top:20px;padding:0 34px;line-height:1.5}
.det{margin:auto 16px 38px;background:#fff;color:#09090b;border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;animation:up .3s ease}
.det .av{width:42px;height:42px;border-radius:12px;background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;flex:none}
.det .av svg{width:20px;height:20px}
.det .k{font-size:10.5px;color:#16a34a;font-weight:700;letter-spacing:.4px}
.det b{display:block;font-size:13.5px;margin-top:1px}.det div span{font-size:11.5px;color:var(--muted-foreground)}

/* ═════════ BANK WEBSITE (legacy) ═════════ */
.site{background:#f5f5f7}
.site .grid2{grid-template-columns:minmax(0,1fr) 340px;max-width:1000px}
.fld{margin-top:14px}
.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.fld .in{height:44px;border:1px solid var(--input);border-radius:var(--radius);padding:0 13px;display:flex;align-items:center;font-size:14px;background:#fff;letter-spacing:.3px}
.fld .in.f{border-color:var(--bc);box-shadow:0 0 0 3px color-mix(in srgb,var(--bc) 14%,transparent)}
.fld .in .ph{color:#a1a1aa;letter-spacing:0}
.caret{width:1.5px;height:17px;background:#09090b;margin-left:1px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.sbtn{text-align:center;margin-top:18px;height:46px;width:100%;border-radius:var(--radius);background:var(--bc);color:#fff;font-size:14px;font-weight:700}
.sbtn:hover{filter:brightness(1.06)}
.otp{display:flex;gap:10px;margin-top:16px}
.otp i{width:48px;height:54px;border:1px solid var(--input);border-radius:var(--radius);display:grid;place-items:center;font-style:normal;font-size:20px;font-weight:700;background:#fff}
.otp i.f{border-color:var(--bc);box-shadow:0 0 0 3px color-mix(in srgb,var(--bc) 14%,transparent)}
.note{font-size:11.5px;color:var(--muted-foreground);text-align:center;margin-top:12px}
.load{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--subtle);font-size:14px;font-weight:500}
.load .spin{width:28px;height:28px;color:var(--bc)}
.friction{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

/* ═════════ DEV DRAWER + SCREENS MENU ═════════ */
.drawer{position:absolute;top:64px;right:0;bottom:0;width:420px;max-width:100%;background:#0b0b0e;color:#e4e4e7;z-index:60;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.drawer.on{transform:none;box-shadow:-18px 0 40px rgba(9,9,11,.18)}
.dr-h{padding:18px 22px 14px;border-bottom:1px solid #27272a}
.dr-h .k{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:1.1px;color:#a5b4fc;text-transform:uppercase}
.dr-h b{display:block;font-size:15px;color:#fff;margin-top:8px;letter-spacing:-.2px}
.dr-h p{font-size:12.5px;color:#a1a1aa;margin-top:4px;line-height:1.55}
.dr-x{position:absolute;right:16px;top:16px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#a1a1aa;border:1px solid #27272a}
.dr-b{padding:16px 22px;overflow:auto;flex:1}
.ep{display:inline-flex;gap:8px;align-items:center;font-family:var(--mono);font-size:11.5px;background:#18181b;border:1px solid #27272a;border-radius:7px;padding:5px 9px;color:#e4e4e7}
.ep i{font-style:normal;font-weight:600;color:#86efac}
.dr-b pre{font-family:var(--mono);font-size:11.5px;line-height:1.65;color:#d4d4d8;white-space:pre-wrap;word-break:break-word;margin-top:12px;background:#111114;border:1px solid #1f1f23;border-radius:10px;padding:14px}
.dr-b pre .k{color:#93c5fd}.dr-b pre .s{color:#86efac}.dr-b pre .c{color:#71717a}.dr-b pre .n{color:#fcd34d}
.dr-note{font-size:12px;color:#a1a1aa;line-height:1.6;margin-top:14px;padding:11px 13px;border:1px solid #27272a;border-radius:10px}
.dr-note b{color:#e4e4e7}
.fab{position:absolute;right:22px;bottom:20px;z-index:55;height:40px;padding:0 16px;border-radius:100px;background:var(--primary);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg)}
.menu{position:absolute;right:22px;bottom:70px;z-index:56;width:300px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 50px rgba(9,9,11,.18);padding:8px;max-height:calc(100% - 100px);overflow:auto}
.menu .g{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted-foreground);padding:10px 10px 6px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:500}
.menu button:hover{background:var(--secondary)}
.menu button.on{background:var(--secondary);font-weight:700}
.menu button i{font-style:normal;width:20px;height:20px;border-radius:6px;background:var(--secondary);border:1px solid var(--border);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--subtle);flex:none}

/* ═════════ SHELL (demo chrome) ═════════ */
.app{height:100%;display:flex;flex-direction:column}
.topbar{height:58px;flex:none;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 18px;position:relative;z-index:50}
.tb-brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.tb-brand .dl{height:13px;width:67px;color:#09090b;flex:none}
.tb-sep{width:1px;height:24px;background:var(--border);flex:none}
.tb-t{font-size:13.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;line-height:1.25}
.tb-t small{display:block;font-size:11px;color:var(--muted-foreground);font-weight:500;letter-spacing:0}
.rtabs{display:inline-flex;background:var(--secondary);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px;flex:none}
.rtabs button{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--subtle);white-space:nowrap;transition:.15s}
.rtabs button:hover{color:var(--foreground)}
.rtabs button.on{background:#fff;color:var(--foreground);box-shadow:0 1px 2px rgba(9,9,11,.08),0 0 0 1px var(--border)}
.rtabs .i{width:15px;height:15px}
.rtabs .tg{font-size:9.5px;font-weight:700;letter-spacing:.3px;padding:1px 6px;border-radius:100px;background:var(--success-bg);color:var(--success-tx);border:1px solid var(--success-bd)}
.rtabs .tg.old{background:var(--secondary);color:var(--muted-foreground);border-color:var(--border)}
.tb-r{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end}
.tbtn{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;color:var(--foreground);transition:.15s}
.tbtn:hover{background:var(--secondary)}
.tbtn .i{width:15px;height:15px}
.demo-seg{display:inline-flex;align-items:center;gap:2px;background:var(--secondary);border:1px solid var(--border);border-radius:100px;padding:3px}
.demo-seg .lbl{font-size:10px;font-weight:700;letter-spacing:.8px;color:#a1a1aa;padding:0 8px 0 7px}
.demo-seg button{font-size:11.5px;font-weight:600;color:var(--subtle);padding:5px 12px;border-radius:100px;display:inline-flex;align-items:center;gap:5px}
.demo-seg button.on{background:var(--primary);color:#fff}
.dev-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;color:var(--foreground);position:relative;transition:.15s}
.dev-btn:hover{background:var(--secondary)}
.dev-btn.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.dev-btn.attract{border-color:#c7d2fe;background:#eef2ff;color:#4338ca}
.dev-btn.attract::after{content:"";position:absolute;inset:-4px;border-radius:12px;border:2px solid #818cf8;animation:ring 1.8s ease-out infinite}
@keyframes ring{from{opacity:.8;transform:scale(.92)}to{opacity:0;transform:scale(1.18)}}

.main{flex:1;min-height:0;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;animation:fade .3s ease}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.web-in{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:22px 20px var(--gh,116px)}
.fitw{position:relative;flex:none}
.fiti{position:absolute;left:0;top:0;transform-origin:0 0}

/* guide bar */
.guide{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(900px,calc(100% - 32px));background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 14px 40px rgba(9,9,11,.16),0 2px 6px rgba(9,9,11,.06);display:flex;align-items:center;gap:14px;padding:10px;z-index:45;overflow:hidden}
.g-bar{position:absolute;left:0;top:0;height:3px;background:var(--foreground);transition:width .35s ease}
.g-back{width:42px;height:42px;border-radius:10px;border:1px solid var(--border);display:grid;place-items:center;flex:none;color:var(--foreground)}
.g-back:hover{background:var(--secondary)}
.g-back:disabled{opacity:.35;cursor:not-allowed}
.g-tx{flex:1;min-width:0;padding:1px 0}
.g-k{font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted-foreground);display:flex;gap:8px;align-items:center;white-space:nowrap}
.g-k .badge{text-transform:none;letter-spacing:.1px}
.g-t{font-size:14.5px;font-weight:700;letter-spacing:-.25px;margin-top:2px}
.g-d{font-size:12.5px;color:var(--subtle);line-height:1.45;margin-top:1px}
.g-next{height:46px;padding:0 20px;border-radius:10px;background:var(--primary);color:#fff;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;flex:none;transition:.15s}
.g-next:hover{background:#27272a}
.toast{position:absolute;top:16px;left:24px;background:#09090b;color:#fff;font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:100px;display:flex;gap:8px;align-items:center;z-index:44;pointer-events:none;opacity:0}
.toast.go{animation:toast 3.2s ease forwards}
.toast .i{width:15px;height:15px}
@keyframes toast{0%{opacity:0;transform:translateY(-6px)}10%,82%{opacity:1;transform:none}100%{opacity:0;transform:none}}

/* ═════════ DECENTRO HOSTED CHECKOUT (production screens) ═════════
   @dev These match the live checkout 1:1: Montserrat, 480px modal, black
   header, #EEF7FF summary, 72px method rows, status illustrations. */
.co{width:480px;background:#fafafa;border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(9,9,11,.13),0 2px 6px rgba(9,9,11,.05);font-family:'Montserrat','Inter',sans-serif;color:#000;display:flex;flex-direction:column;text-align:left}
.co.list{max-height:896px}
.co.white{background:#fff}
.co-h{height:76px;flex:none;background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:18px;font-weight:600;letter-spacing:.1px}
.co-h .x svg{width:15px;height:15px;stroke:#fff;stroke-width:3.2;stroke-linecap:round;display:block}
.co-sbw{background:#000;flex:none}
.co-b{padding:18px 16px 22px;display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.co.status .co-b{padding:20px 20px 30px}
.cs{background:#eef7ff;border-radius:10px;padding:17px 20px 14px;flex:none}
.cs.plain{padding:18px 20px}
.cs-r{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cs-r b{display:block;font-size:14.5px;font-weight:600}
.cs-r span{display:block;font-size:10.5px;margin-top:5px;font-weight:500}
.cs-a{font-size:18px;font-weight:600;white-space:nowrap}
.cs-l{height:1px;background:#dce8f5;margin:12px 0 13px}
.cs-2{display:flex;justify-content:space-between;align-items:flex-end;font-size:9.5px;font-weight:500}
.cs-2 b{display:block;font-weight:600;margin-bottom:1px}
.cs-2 .r{text-align:right}
.red{color:#e65c5c;font-weight:600}
.cs-t{font-size:10px;font-weight:500}.cs-t b{font-weight:600;margin-right:3px}
.co-sel{text-align:center;color:#1e3354;margin:27px 0 17px;flex:none}
.co-sel b{display:block;font-size:14.5px;font-weight:500}
.co-sel span{display:block;font-size:12.5px;font-weight:500;margin-top:1px}
.op{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(16,24,40,.05);overflow:hidden;flex:none}
.op + .op{margin-top:16px}
.op-r{display:flex;align-items:center;width:100%;height:72px;padding:0 20px 0 21px;gap:20px;text-align:left;background:#fff;transition:background .15s}
.op-r img.ic{width:44px;height:44px;border-radius:50%;flex:none}
.op-t{flex:1;font-size:15px;font-weight:600;color:#000;line-height:1.2}
.op-t small{display:block;font-size:10.5px;font-weight:500;color:#6b7280;margin-top:3px}
.op-r img.bdg{height:30px;flex:none}
.chv{width:20px;height:20px;stroke:#000;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.op.open .op-r{box-shadow:0 5px 10px -4px rgba(16,24,40,.08);position:relative;z-index:1}
.op-s{display:flex;align-items:center;justify-content:space-between;width:100%;height:73px;padding:0 20px 0 33px;background:#fafdff;font-size:15px;font-weight:500;color:#000;text-align:left;transition:background .15s}
.op-s:hover,button.op-r:hover{background:#f2f8ff}
.op-r.hint,.op-s.hint,.bk-c.hint{animation:rowhint 1.6s ease-in-out infinite;position:relative}
.op-s.hint::before,.op-r.hint::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:#0092ff}
@keyframes rowhint{0%,100%{background:#fafdff}50%{background:#dcecff}}
.co-f{display:flex;flex-direction:column;align-items:center;margin-top:28px;flex:none}
.co-f .tr{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:#00a4ff}
.co-f .tr svg{width:14px;height:14px;fill:#0092ff}
.co-f .pb{font-size:6px;font-weight:600;letter-spacing:.7px;color:#8a8a8a;margin-top:8px}
.co-f .dl{height:13px;width:88px;color:#000;margin-top:3px;display:block}
.co-f .nb{margin-top:3px;display:block;line-height:0}
.co.list .co-f{margin-top:26px}
/* QR */
.qr-h{text-align:center;font-size:14.5px;color:#1e3354;margin:25px 0 28px;font-weight:500;flex:none}
.qr-h b{font-weight:600}
.qr-img{align-self:center;background:#fff;width:346px;height:346px;flex:none;border-radius:6px}
.qr-img img{width:346px;height:346px;display:block}
.qr-ex{text-align:center;font-size:15px;font-weight:600;margin-top:22px;flex:none}
.qr-ex .red{margin-left:7px}
/* banks */
.bk-top{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding-left:8px;flex:none}
.bk-top button{display:grid;place-items:center;width:34px;height:34px;border-radius:8px}
.bk-top button:hover{background:#eef2f7}
.bk-top svg{width:26px;height:26px;stroke:#000;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bk-srch{flex:1;height:54px;border:1px solid #cfd6e0;border-radius:28px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 26px;color:#8a94a4;font-size:15px;font-weight:500}
.bk-srch svg{width:16px;height:16px;stroke:#8a94a4;fill:none;stroke-width:2}
.bk-g{display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid #e6eaf0;border-radius:14px;overflow:hidden;flex:none}
.bk-c{height:96px;display:grid;place-items:center;border-right:1px solid #e6eaf0;border-bottom:1px solid #e6eaf0;background:#fff;transition:background .15s}
.bk-c:nth-child(2n){border-right:0}.bk-c:nth-last-child(-n+2){border-bottom:0}
.bk-c:hover{background:#f5f9ff}
.bk-c img{width:196px;height:76px;object-fit:contain;display:block;mix-blend-mode:multiply}
/* status */
.st-ill{align-self:center;width:212px;height:144px;flex:none}
.st-ill img{width:100%;height:100%;display:block}
.st-ill.small{width:132px;height:145px;margin-top:60px}
.st-base{align-self:center;width:286px;height:1.5px;background:#dfe7ef;flex:none}
.st-t{text-align:center;font-size:19px;font-weight:600;color:#102c56;margin-top:22px}
.st-d{text-align:center;font-size:13px;color:#8a94a4;line-height:18px;margin:10px auto 0;max-width:290px}
.st-pill{align-self:center;margin-top:20px;width:286px;height:54px;border:1.5px solid #dfe6ee;border-radius:30px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:500;flex:none}
.st-pill b{color:#0092ff;font-weight:600}
.st-note{margin:22px auto 0;width:400px;max-width:100%;background:#f5f5f5;border-radius:8px;padding:14px 16px;text-align:center;font-size:12.5px;line-height:1.25;color:#111;flex:none}
.co.status .co-f{margin-top:17px}
.co.status .st-gap{height:40px;flex:none}
/* loader card */
.co.load{background:#fafafa;padding:44px 24px 40px;align-items:center}
.co.load img{width:268px;height:280px;display:block}
.co.load b{font-size:18px;font-weight:600;color:#1e3354;margin-top:6px;text-align:center}
/* phone-width variant of the same checkout */
.co.m{width:100%;height:100%;border-radius:0;box-shadow:none;max-height:none}
.co.m .co-h{height:58px;padding:0 20px;font-size:15.5px}
.co.m .co-b{padding:14px 12px 16px}
.co.m .cs{padding:14px 16px 12px}.co.m .cs-r b{font-size:13px}.co.m .cs-a{font-size:16px}
.co.m .co-sel{margin:18px 0 12px}.co.m .co-sel b{font-size:13.5px}.co.m .co-sel span{font-size:11.5px}
.co.m .op + .op{margin-top:10px}
.co.m .op-r{height:62px;padding:0 14px;gap:13px}.co.m .op-r img.ic{width:38px;height:38px}.co.m .op-t{font-size:13.5px}.co.m .op-r img.bdg{height:24px}
.co.m .op-s{height:56px;padding:0 14px 0 22px;font-size:13.5px}
.co.m .co-f{margin-top:auto;padding:14px 0 18px}
.co.m.status .co-b{padding:14px 14px 20px}.co.m .st-note{width:auto}.co.m .st-t{font-size:17px}
.co.load.m{justify-content:center;padding:0 20px;position:relative}
.co.load.m .sb{position:absolute;top:0;left:0;right:0}
.co.load.m img{width:220px;height:230px}.co.load.m b{font-size:15.5px}

/* ═════════ STAGE additions ═════════ */
.stage{padding-bottom:calc(var(--gh,116px) + 4px)!important}
.devc,.lapc{position:relative}
.devc-in,.lapc-in{position:absolute;left:0;top:0;transform-origin:0 0}
.dev-cap{position:absolute;left:-60px;right:-60px;bottom:calc(100% + 10px);text-align:center;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted-foreground);white-space:nowrap}
.stage:not(.r-qr) .dev-cap,.stage:not(.r-qr) .lapc{display:none}
.stage.r-qr{grid-template-columns:auto auto 290px;gap:34px;padding-top:40px}
.stage.r-qr .col-l,.stage.r-qr #live-card{display:none}
.stage.enter .lapc{animation:lapIn .8s cubic-bezier(.2,.8,.2,1)}
.stage.enter .devc{animation:phIn .7s .3s cubic-bezier(.2,.8,.2,1) both}
.stage.enter .col-r,.stage.enter .col-l{animation:fade .5s .6s both}
@keyframes lapIn{from{transform:translateX(20%) scale(1.35);opacity:.3}to{transform:none;opacity:1}}
@keyframes phIn{from{transform:translateX(90px);opacity:0}to{transform:none;opacity:1}}
@media (max-height:900px){ .stage.r-qr #ev-card{display:none} }
/* laptop, design size 1420×862 (1280×762 page inside the browser) */
.laptop{width:1420px;height:862px;position:relative}
.lid{position:absolute;left:54px;top:0;width:1312px;height:838px;background:#111113;border-radius:30px 30px 10px 10px;padding:20px 16px 16px;box-shadow:0 0 0 2px #3f3f46 inset,0 0 0 1.5px #d4d4d8,0 30px 70px rgba(9,9,11,.16)}
.lid::before{content:"";position:absolute;top:8px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#2e2e33}
.lscr{width:100%;height:100%;border-radius:6px;overflow:hidden;background:#e4e4e6;display:flex;flex-direction:column}
.lchrome{height:40px;flex:none;background:#f4f4f5;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:14px}
.ldots{display:flex;gap:7px}.ldots i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.ldots i:nth-child(2){background:#febc2e}.ldots i:nth-child(3){background:#28c840}
.lurl{flex:1;max-width:520px;margin:0 auto;height:28px;border-radius:8px;background:#fff;border:1px solid var(--border);font-size:13px;color:#52525b;display:flex;align-items:center;justify-content:center;gap:7px;transform:translateX(-34px)}

/* swipe to pay */
function wireSwipe(done){
  const sw=$('#swipe'), kn=$('#knob'); if(!sw) return;
  const max=()=>sw.clientWidth-kn.offsetWidth-10, set=x=>{kn.style.left=(5+x)+'px';sw.querySelector('.fill').style.width=(x+34)+'px'};
  let sx=null;
  kn.addEventListener('pointerdown',e=>{sx=e.clientX;kn.setPointerCapture(e.pointerId);sw.classList.remove('anim','hint')});
  kn.addEventListener('pointermove',e=>{if(sx===null)return;set(Math.max(0,Math.min(max(),(e.clientX-sx)/SCALE)))});
  kn.addEventListener('pointerup',e=>{if(sx===null)return;const x=(e.clientX-sx)/SCALE;sx=null;if(x>max()*.8)fin();else{sw.classList.add('anim');set(0)}});
  function fin(){ if(sw._done) return; sw._done=1; sw.classList.add('anim'); set(max()); sw.querySelector('.sl').textContent='Confirmed'; later(450,done); }
  sw._finish=fin;
}

  else st=`<div class="stpill wait"><span class="spin"></span>Waiting for the bank app</div>`;
  $('#live-st').innerHTML = st;
  $('#live-b').className='badge '+(paid?'b-success':'b-outline'); $('#live-b').textContent=paid?'Paid':'Live';
  const evs = EVENTS[ROUTE].filter(v=>IDX>v.at || (IDX===v.at && (!v.p || paid)));
  const pend = paid?'':`<li class="pend"><time>··:··:··</time><span class="x"><span class="spin"></span>${acting?'Waiting for the bank':'Waiting for the payer'}</span></li>`;
  const show = (ROUTE==='qr'||innerHeight<760) ? evs.slice(-5) : evs;
  $('#ev').innerHTML = show.map(v=>`<li><time>${hms(v.o)}</time><span class="x">${fill(v.x)}${v.b?`<span class="badge ${v.b==='NBBL'?'b-info':'b-success'}">${v.b}</span>`:''}</span></li>`).join('') + pend;
  if(ROUTE==='qr'){
    const lst = paid?'success':acting?'loading':'qr';
    $('#lfi').innerHTML = modal(lst,{hint:['home','unlock','dash','scan'].includes(e.ps)});
    if(paid) countdown();
    fit($('#lfw'),$('#lfi'),1240,720);
  }
}
/* device scale: phone 384×792 and laptop 1420×862 design sizes */
let SCALE=1, LSCALE=1;
function layoutDevices(){
  const st=$('#stage'); if(!$('#sc-stage').classList.contains('on')) return;
  const cs=getComputedStyle(st), narrow=innerWidth<=900, qr=ROUTE==='qr';
  const H = narrow ? Math.min(innerHeight*0.72, 792) : st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-(qr?6:0);
  const W = narrow ? innerWidth-32 : 9999;
  SCALE = Math.max(.45, Math.min(qr&&!narrow?.95:1, H/792, W/384));
  $('#devc').style.width=384*SCALE+'px'; $('#devc').style.height=792*SCALE+'px'; $('#devc-in').style.transform=`scale(${SCALE})`;
  if(qr){
    const colR = innerWidth>1180 ? 290+34 : 0;
    const avail = narrow ? innerWidth-32 : st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-384*SCALE-34-colR;
    LSCALE = Math.max(.2, Math.min(.7, avail/1420, (narrow?9999:H*0.85)/862));
    $('#lapc').style.width=1420*LSCALE+'px'; $('#lapc').style.height=862*LSCALE+'px'; $('#lapc-in').style.transform=`scale(${LSCALE})`;
  }
}
/* bank website */
function paintSite(){
  const p=cur().ps, el=$('#site');
  $('#sc-site').style.cssText=bv();
  $('#siteh').innerHTML=`<b>${B().n}<small>Internet Banking</small></b><span>${I.lock}Secure session</span>`;
  if(p==='login'){ if(BACKING) el.innerHTML=siteLogin('','','x'); else { el.innerHTML=siteLoad(`Taking you to ${B().n}…`); later(900,()=>el.innerHTML=siteLogin('','','x')); } }
  if(p==='otp') el.innerHTML=siteOtp('');
  if(p==='confirm') el.innerHTML=siteConfirm();
}

/* ═════════════════════════════════════════════════════════════════════════
   NAVIGATION
   ═════════════════════════════════════════════════════════════════════════ */
function setGH(){ const g=$('#guide'); $('#main').style.setProperty('--gh', (g.offsetHeight+parseFloat(getComputedStyle(g).bottom)+16)+'px'); }
function render(){
  clearT(); const e=cur();
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id==='sc-'+e.sc));
  paintTop(); paintGuide(); setGH();
  if(e.sc==='web') paintWeb();
  if(e.sc==='stage') paintStage();
  if(e.sc==='site') paintSite();
  paintDrawer(); paintMenu();
  BACKING=false;
  if(AUTO) schedule();
}
function go(i){ if(i<0||i>=SEQ[ROUTE].length) return; BACKING = i<IDX; IDX=i; render(); }
function next(){
  const e=cur();
  if(IDX===SEQ[ROUTE].length-1){ if(ROUTE==='out'){ ROUTE='qr'; IDX=0; timeLeft=299; render(); } else { ROUTE='out'; IDX=0; render(); } return; }
  if(e.ps==='review'){ if(!$('#swipe')){ setPhone(review()); wireSwipe(()=>go(IDX+1)); } $('#swipe')._finish(); return; }
  if(e.ps==='mpin'){ autoPin(); return; }
  if(e.ps==='unlock'){ setPhone(unlock(true)); later(600,()=>go(IDX+1)); return; }
  if(e.ps==='scan' && !document.querySelector('.vf.got')){ setPhone(scanScr(true)); later(700,()=>go(IDX+1)); return; }
  if(e.ps==='login'){ const f=(u,p,x)=>$('#site').innerHTML=siteLogin(u,p,x);
    typeInto('rohan.m84',60,v=>f(v,'','u'),()=>typeInto('••••••••••',45,v=>f('rohan.m84',v,'p'),()=>go(IDX+1))); return; }
  if(e.ps==='otp'){ typeInto('482913',110,v=>$('#site').innerHTML=siteOtp(v),()=>go(IDX+1)); return; }
  if(e.ps==='confirm'){ $('#site').innerHTML=siteConfirm(true); later(900,()=>go(IDX+1)); return; }
  go(IDX+1);
}
function back(){ if(IDX>0) go(IDX-1); }
function setRoute(r, i=0){ ROUTE=r; IDX=i; if(i===0) timeLeft=299; render(); }
const HOLD = {web:2800, site:2400, stage:2600};
function schedule(){ const e=cur(); if(IDX===SEQ[ROUTE].length-1 && ROUTE!=='out'){ later(6000,()=>{ setRoute(ROUTE); }); return; }
  const h = e.ps==='review'&&ROUTE==='app'?3400 : e.ps==='receipt'?4200 : e.ps==='mdone'?4000 : e.ps==='scan'?2600 : HOLD[e.sc]; later(h, next); }

function paintDrawer(){
  const d=DEV[cur().dev]();
  $('#dr-t').textContent=d.t; $('#dr-p').textContent=`${ROUTE==='out'?'Other outcomes':RT[ROUTE][0]} · screen ${IDX+1} of ${SEQ[ROUTE].length}`;
  $('#dr-ep').innerHTML=d.ep.replace(/^(POST|GET)/,'<i>$1</i>'); $('#dr-code').innerHTML=d.code;
  $('#dr-note').innerHTML=d.note+'<br><br><span style="opacity:.7">Endpoint names are illustrative. Confirm against the NB 2.0 spec.</span>';
  $('#drawer').classList.toggle('on',DEVON);
}
function paintMenu(){
  const G={qr:'Net-Banking QR (desktop → phone)',app:'Bank app on mobile',web:'Bank website (today)',out:'Other outcomes'};
  $('#menu').innerHTML = Object.keys(SEQ).map(r=>`<div class="g">${G[r]}</div>`+SEQ[r].map((e,i)=>`<button class="${r===ROUTE&&i===IDX?'on':''}" data-jump="${r}:${i}"><i>${i+1}</i>${e.lb}</button>`).join('')).join('');
}
function setAuto(v){ if(AUTO===v) return; AUTO=v; paintTop(); clearT(); if(AUTO) render(); }

document.addEventListener('click', ev=>{
  const t=ev.target, a=t.closest('[data-act]');
  if(a){ if(AUTO) setAuto(false); const k=a.dataset.act, e=cur();
    if(k==='nb'){ if(e.st==='list') next(); else if(e.st==='open') back(); }
    else if(k==='route'){ const r=a.dataset.r; if(r!==ROUTE){ ROUTE=r; } IDX=2; BACKING=false; render(); }
    else if(k==='bank'){ BANK=a.dataset.k; next(); }
    else if(k==='next') next(); else if(k==='back') back();
    else if(k==='pick'||k==='homeapp'){ BANK=a.dataset.k; go(IDX+1); }
    else if(k==='fp') next(); else if(k==='scan'){ next(); }
    else if(k==='acct'){ ACCT=+a.dataset.i; setPhone(review()); wireSwipe(()=>go(IDX+1)); }
    else if(k==='key') press(a); else if(k==='del'){ PIN=PIN.slice(0,-1); pins(); } else if(k==='fpkey'){ PIN='••••'; pins(); }
    return; }
  const r=t.closest('[data-route]'); if(r){ setAuto(false); setRoute(r.dataset.route); return; }
  const au=t.closest('[data-auto]'); if(au){ setAuto(au.dataset.auto==='1'); return; }
  if(t.closest('#g-next')){ setAuto(false); next(); return; }
  if(t.closest('#g-back')){ setAuto(false); back(); return; }
  if(t.closest('#devbtn')){ DEVON=!DEVON; ATTRACT=false; paintTop(); paintDrawer(); return; }
  if(t.closest('#dr-x')){ DEVON=false; paintTop(); paintDrawer(); return; }
  if(t.closest('#scrBtn')){ $('#menu').hidden=!$('#menu').hidden; return; }
  const j=t.closest('[data-jump]'); if(j){ const [rr,i]=j.dataset.jump.split(':'); ROUTE=rr; IDX=+i; BACKING=true; $('#menu').hidden=true; setAuto(false); render(); return; }
  if(!t.closest('#menu')) $('#menu').hidden=true;
});
document.addEventListener('keydown', e=>{ if(e.key==='ArrowRight'){ setAuto(false); next(); } if(e.key==='ArrowLeft'){ setAuto(false); back(); }
  if(e.key==='Escape'){ $('#menu').hidden=true; DEVON=false; paintTop(); paintDrawer(); } });
addEventListener('resize', ()=>{ setGH(); fitWeb(); layoutDevices(); });
setInterval(()=>{ if(timeLeft>0) timeLeft--; document.querySelectorAll('[data-timer-x]').forEach(e=>e.textContent=mm(timeLeft)+' mins'); document.querySelectorAll('[data-timer-m]').forEach(e=>e.textContent=mm(timeLeft)+' min'); },1000);
render();
if(document.fonts) document.fonts.ready.then(()=>{ fitWeb(); layoutDevices(); });

</script>
